      }

      function drawFishBody(pen, fish, time, isHero, hovered) {
        const strength = fish.selectedBlend;
        const scan = ((time * 0.17 + fish.phase * 0.1) % 1);
        const scanY = -190 + ((time * 0.21 + fish.phase * 0.13) % 1) * 365;
        const detail = isHero || fish.state.scale > 0.58 ? 1 : fish.state.scale > 0.24 ? 0.52 : 0.28;
        const hue = fish.hue;
        const primary = `hsla(${hue}, 100%, 68%, 1)`;
        const pale = `hsla(${hue - 6}, 100%, 82%, 1)`;
        const deep = `hsla(${hue + 8}, 95%, 52%, 1)`;
        const icy = `hsla(${hue - 168}, 100%, 79%, 1)`;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        const bodyBase = ctx.createLinearGradient(-390, -165, 250, 145);
        bodyBase.addColorStop(0, `hsla(${hue - 4}, 96%, 64%, ${0.24 + strength * 0.055})`);
        bodyBase.addColorStop(0.5, `hsla(${hue + 2}, 94%, 53%, ${0.19 + strength * 0.04})`);
        bodyBase.addColorStop(1, `hsla(${hue + 12}, 92%, 42%, ${0.07 + strength * 0.025})`);
        ctx.fillStyle = bodyBase;
        bodyPath(ctx);
        ctx.fill();
        ctx.restore();

        drawGlowSprite(
          glowHotPink,
          -76,
          -5,
          980 + strength * 210,
          440 + strength * 100,
          0.045 + strength * 0.035
        );
        drawGlowSprite(glowCyan, -379, -54, 190 + strength * 70, 176 + strength * 60, 0.025 + strength * 0.02);

        const aura = ctx.createLinearGradient(-430, -130, 500, 130);
        aura.addColorStop(0, `hsla(${hue}, 100%, 67%, ${0.2 + strength * 0.1})`);
        aura.addColorStop(0.38, `hsla(${hue - 7}, 100%, 73%, ${0.08 + strength * 0.05})`);
        aura.addColorStop(0.78, `hsla(${hue + 8}, 100%, 62%, ${0.12 + strength * 0.06})`);
        aura.addColorStop(1, `hsla(${hue + 12}, 100%, 62%, 0)`);
        ctx.fillStyle = aura;
        bodyPath(ctx);
        ctx.fill();

        ctx.save();
        bodyPath(ctx);
        ctx.clip();

        const innerGlow = ctx.createRadialGradient(-322, -56, 0, -260, -24, 355);
        innerGlow.addColorStop(0, `hsla(${hue - 5}, 100%, 94%, ${0.18 + strength * 0.1})`);
        innerGlow.addColorStop(0.22, `hsla(${hue}, 100%, 78%, ${0.1 + strength * 0.06})`);
        innerGlow.addColorStop(0.55, `hsla(${hue + 2}, 100%, 61%, ${0.055 + strength * 0.03})`);
        innerGlow.addColorStop(1, "rgba(255, 64, 158, 0)");
        ctx.fillStyle = innerGlow;
        ctx.fillRect(-450, -210, 900, 400);

        const bodyVolume = ctx.createRadialGradient(-92, -10, 0, -76, -8, 380);
        bodyVolume.addColorStop(0, `hsla(${hue - 4}, 100%, 86%, ${0.09 + strength * 0.07})`);
        bodyVolume.addColorStop(0.46, `hsla(${hue}, 100%, 66%, ${0.05 + strength * 0.025})`);
        bodyVolume.addColorStop(1, `hsla(${hue + 12}, 100%, 54%, 0)`);
        ctx.fillStyle = bodyVolume;
        ctx.fillRect(-450, -220, 900, 420);

        const iridescence = ctx.createLinearGradient(-430, -185, 310, 160);
        iridescence.addColorStop(0, `hsla(${hue - 165}, 100%, 82%, ${0.07 + strength * 0.04})`);
        iridescence.addColorStop(0.28, `hsla(${hue - 8}, 100%, 87%, ${0.035 + strength * 0.025})`);
        iridescence.addColorStop(0.56, `hsla(${hue + 4}, 100%, 72%, 0)`);
        iridescence.addColorStop(0.8, `hsla(${hue - 150}, 100%, 78%, ${0.025 + strength * 0.02})`);
        iridescence.addColorStop(1, "rgba(80, 238, 255, 0)");
        ctx.fillStyle = iridescence;
        ctx.fillRect(-450, -220, 900, 420);

        const dorsalSheen = ctx.createLinearGradient(0, -205, 0, 58);
        dorsalSheen.addColorStop(0, `hsla(${hue - 170}, 100%, 88%, ${0.09 + strength * 0.045})`);
        dorsalSheen.addColorStop(0.2, `hsla(${hue - 4}, 100%, 89%, ${0.06 + strength * 0.03})`);
        dorsalSheen.addColorStop(0.58, "rgba(255, 170, 216, 0)");
        dorsalSheen.addColorStop(1, "rgba(255, 78, 172, 0)");
        ctx.fillStyle = dorsalSheen;
        ctx.fillRect(-450, -220, 900, 420);

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        const bellyShade = ctx.createLinearGradient(0, 4, 0, 164);
        bellyShade.addColorStop(0, "rgba(33, 0, 27, 0)");
        bellyShade.addColorStop(0.62, "rgba(28, 0, 31, .09)");
        bellyShade.addColorStop(1, "rgba(4, 0, 13, .25)");
        ctx.fillStyle = bellyShade;
        ctx.fillRect(-450, -20, 900, 220);
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        const pearlHead = ctx.createRadialGradient(-314, -73, 0, -284, -56, 185);
        pearlHead.addColorStop(0, `rgba(255, 237, 248, ${0.055 + strength * 0.04})`);
        pearlHead.addColorStop(0.46, `rgba(191, 244, 255, ${0.025 + strength * 0.025})`);
        pearlHead.addColorStop(1, "rgba(255, 186, 224, 0)");
        ctx.fillStyle = pearlHead;
        ctx.fillRect(-450, -205, 900, 400);

        const pearlBack = ctx.createRadialGradient(-79, -92, 0, -70, -76, 155);
        pearlBack.addColorStop(0, `rgba(255, 231, 246, ${0.032 + strength * 0.03})`);
        pearlBack.addColorStop(0.54, `rgba(126, 236, 252, ${0.015 + strength * 0.015})`);
        pearlBack.addColorStop(1, "rgba(255, 172, 218, 0)");
        ctx.fillStyle = pearlBack;
        ctx.fillRect(-450, -205, 900, 400);
        ctx.restore();

        for (let y = -170; y <= 146; y += detail > 0.7 ? 16 : 31) {
          const wave = 0.5 + 0.5 * Math.sin(y * 0.077 - time * 2.1 + fish.phase);
          ctx.globalAlpha = 0.018 + wave * 0.036 + strength * 0.008;
          ctx.fillStyle = pale;
          ctx.fillRect(-450, y, 900, 0.8);
        }

        const scanX = -440 + scan * 880;
        const scanGradient = ctx.createLinearGradient(scanX - 30, 0, scanX + 28, 0);
        scanGradient.addColorStop(0, "rgba(255, 84, 183, 0)");
        scanGradient.addColorStop(0.52, `rgba(255, 181, 225, ${0.08 + strength * 0.08})`);
        scanGradient.addColorStop(1, "rgba(255, 84, 183, 0)");
        ctx.fillStyle = scanGradient;
        ctx.fillRect(scanX - 38, -220, 76, 420);

        const sweepGradient = ctx.createLinearGradient(0, scanY - 31, 0, scanY + 31);
        sweepGradient.addColorStop(0, "rgba(92, 242, 255, 0)");
        sweepGradient.addColorStop(0.44, `hsla(${hue - 163}, 100%, 86%, ${0.035 + strength * 0.055})`);
        sweepGradient.addColorStop(0.52, `hsla(${hue - 3}, 100%, 92%, ${0.09 + strength * 0.08})`);
        sweepGradient.addColorStop(0.6, `hsla(${hue - 163}, 100%, 86%, ${0.025 + strength * 0.03})`);
        sweepGradient.addColorStop(1, "rgba(92, 242, 255, 0)");
        ctx.fillStyle = sweepGradient;
        ctx.fillRect(-450, scanY - 32, 900, 64);
        ctx.globalAlpha = 0.26 + strength * 0.2;
        ctx.fillStyle = "rgba(255, 224, 242, .9)";
        ctx.fillRect(-450, scanY, 900, 1.1);

        const meshAlpha = 0.018 + strength * 0.012;
        ctx.globalAlpha = meshAlpha;
        ctx.strokeStyle = icy;
        ctx.lineWidth = 0.75;
        for (let line = 0; line < 6; line++) {
          ctx.beginPath();
          ctx.moveTo(-410 + line * 68, -196);
          ctx.bezierCurveTo(
            -300 + line * 55,
            -120 + line * 13,
            -210 + line * 61,
            108 - line * 8,
            -86 + line * 52,
            176
          );
          ctx.stroke();
        }

        if (detail > 0.4) {
          ctx.globalAlpha = 0.075 + strength * 0.04 + detail * 0.016;
          ctx.lineWidth = 0.72;
          const scaleRows = Math.round(2 + detail * 4);
          const scaleColumns = Math.round(5 + detail * 6);
          const rowStep = 236 / scaleRows;
          const columnStep = 610 / scaleColumns;
          for (let row = 0; row < scaleRows; row++) {
            const y = -143 + row * rowStep;
            const offset = row % 2 ? columnStep * 0.5 : 0;
            for (let column = 0; column < scaleColumns; column++) {
              const x = -365 + column * columnStep + offset;
              const scaleSize = 13 + Math.sin(row * 1.7 + column * 0.61) * 2.5;
              ctx.strokeStyle = (row + column) % 6 === 0 ? pale : icy;
              ctx.beginPath();
              ctx.arc(x, y, scaleSize, 0.2, Math.PI - 0.18);
              ctx.stroke();
            }
          }
        }

        const volumeSections = [
          { x: -352, center: -22, height: 115 },
          { x: -270, center: -12, height: 154 },
          { x: -184, center: -5, height: 165 },
          { x: -94, center: 1, height: 150 },
          { x: -2, center: 8, height: 125 },
          { x: 92, center: 10, height: 94 },
          { x: 181, center: 8, height: 66 },
          { x: 255, center: 4, height: 39 }
        ];
        ctx.globalAlpha = 0.045 + strength * 0.025;
        ctx.strokeStyle = icy;
        ctx.lineWidth = 0.7;
        for (const section of volumeSections) {
          ctx.beginPath();
          ctx.ellipse(section.x, section.center, 6, section.height, 0, 0, TAU);
          ctx.stroke();
        }

        ctx.globalAlpha = 0.16 + strength * 0.08;
        ctx.strokeStyle = pale;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(-398, -67);
        ctx.bezierCurveTo(-278, -128, -108, -133, 48, -83);
        ctx.stroke();

        ctx.globalAlpha = 0.44 + strength * 0.15;
        ctx.strokeStyle = icy;
        ctx.lineWidth = 1.05;
        ctx.beginPath();
        ctx.moveTo(-403, -49);
        ctx.bezierCurveTo(-278, -16, -58, 3, 286, -2);
        ctx.stroke();

        ctx.globalAlpha = 0.27 + strength * 0.1;
        ctx.strokeStyle = primary;
        ctx.lineWidth = 0.9;
        const longitudinalLines = [
          { start: -375, top: -125, end: 287, endY: -14 },
          { start: -382, top: 93, end: 282, endY: 9 }
        ];
        for (const line of longitudinalLines) {
          ctx.beginPath();
          ctx.moveTo(line.start, line.top);
          ctx.bezierCurveTo(-190, line.top - 12, 85, line.endY - 9, line.end, line.endY);
          ctx.stroke();
        }

        ctx.globalAlpha = 0.14 + strength * 0.07;
        ctx.fillStyle = pale;
        const moteStride = detail > 0.7 ? 1 : 4;
        for (let index = 0; index < fishDust.length; index += moteStride) {
          const mote = fishDust[index];
          if (mote.x > 310) continue;
          const drift = Math.sin(time * mote.speed + mote.phase) * 4;
          ctx.fillRect(mote.x + drift, mote.y, mote.size, mote.size);
        }

        ctx.restore();

        // Chromatic fringing gives the light volume a projected, optical edge.
        ctx.save();
        ctx.translate(-2.2, 1.1);
        drawFishOutline(ctx, icy, 0.11 + strength * 0.07, 2.2);
        ctx.restore();
        ctx.save();
        ctx.translate(2.2, -1.1);
        drawFishOutline(ctx, primary, 0.12 + strength * 0.07, 2);
        ctx.restore();

        drawFishOutline(ctx, deep, 0.13 + strength * 0.06, 12 + strength * 5);
        drawFishOutline(ctx, primary, 0.28 + strength * 0.14 + (hovered ? 0.16 : 0), 2.2 + strength * 0.9);

        ctx.save();
        ctx.globalAlpha = 0.3 + strength * 0.2 + (hovered ? 0.16 : 0);
        ctx.strokeStyle = pale;
        ctx.lineWidth = 1.15;
        ctx.setLineDash([16, 7, 2, 11]);
        ctx.lineDashOffset = -time * 19;
        bodyPath(ctx);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        ctx.save();
        const rimGradient = ctx.createLinearGradient(-430, -150, 306, 150);
        rimGradient.addColorStop(0, `hsla(${hue - 174}, 100%, 82%, .72)`);
        rimGradient.addColorStop(0.34, `hsla(${hue - 8}, 100%, 88%, .84)`);
        rimGradient.addColorStop(0.72, `hsla(${hue + 2}, 100%, 66%, .36)`);
        rimGradient.addColorStop(1, "rgba(255, 103, 189, 0)");
        ctx.globalAlpha = 0.42 + strength * 0.22;
        ctx.strokeStyle = rimGradient;
        ctx.lineWidth = 1.5;
        bodyTopPath(ctx);
        ctx.stroke();
        ctx.globalAlpha *= 0.65;
        bodyBottomPath(ctx);
        ctx.stroke();
        ctx.restore();

        ctx.globalAlpha = 0.35 + strength * 0.4;
        ctx.strokeStyle = pale;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-387, -74);
        ctx.bezierCurveTo(-278, -120, -128, -126, 16, -79);
        ctx.stroke();

        const glitch = Math.pow(Math.max(0, Math.sin(time * 0.91 + fish.phase * 2.7)), 24);
        if (glitch > 0.08 && detail > 0.4) {
          ctx.save();
          for (let strip = 0; strip < 4; strip++) {
            const y = -170 + Math.sin(fish.phase * 8.1 + strip * 41 + time * 2.3) * 160;
            const height = 2 + strip * 1.2;
            const offset = Math.sin(time * 34 + strip * 5.2) * 15;
            ctx.save();
            ctx.beginPath();
            ctx.rect(-450, y, 900, height);
            ctx.clip();
            ctx.translate(offset, 0);
            ctx.globalAlpha = glitch * (0.26 - strip * 0.035);
            ctx.strokeStyle = strip % 2 ? icy : pale;
            ctx.lineWidth = 1.4;
            bodyPath(ctx);
            ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }

        if (detail > 0.5) {
          ctx.save();
          ctx.fillStyle = pale;
          const emissionCount = Math.round(8 + detail * 10);
          for (let index = 0; index < emissionCount; index++) {
            const phase = (time * 0.23 + index * 0.173 + fish.phase * 0.1) % 1;
            const tailX = 312 + phase * (190 + (index % 4) * 28);
            const tailY = Math.sin(index * 2.27 + time * 0.8) * (34 + phase * 58);
            ctx.globalAlpha = (1 - phase) * (0.14 + strength * 0.16);
            const size = index % 3 === 0 ? 1.7 : 0.85;
            ctx.fillRect(tailX, tailY, size, size);
          }
          ctx.restore();
        }

        drawFishFace(ctx, fish, time, strength);

        if (hovered) {
          ctx.globalAlpha = 0.4;
          ctx.setLineDash([2, 9]);
          ctx.strokeStyle = "rgba(210, 251, 255, .9)";
          ctx.lineWidth = 1;
          bodyPath(ctx);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.restore();
      }

      function drawFishFace(pen, fish, time, strength) {
        const pulse = 0.62 + Math.sin(time * 2.3 + fish.phase) * 0.18 + strength * 0.2;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        ctx.globalAlpha = 0.32 + strength * 0.12;
        ctx.strokeStyle = "rgba(255, 157, 214, .72)";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(-401, 14);
        ctx.quadraticCurveTo(-368, 31, -313, 23);
        ctx.stroke();

        ctx.globalAlpha = 0.42 + strength * 0.12;
        ctx.strokeStyle = "rgba(255, 199, 228, .78)";
        ctx.beginPath();
        ctx.moveTo(-409, 0);
        ctx.quadraticCurveTo(-397, 12, -378, 11);
        ctx.stroke();

        ctx.globalAlpha = 0.55 + strength * 0.1;
        ctx.fillStyle = "rgba(255, 154, 208, .38)";
        ctx.beginPath();
        ctx.ellipse(-405, 4, 5.8, 3.2, -0.04, 0, TAU);
        ctx.fill();

        ctx.globalAlpha = 0.28 + strength * 0.09;
        for (let index = 0; index < 4; index++) {
          ctx.beginPath();
          ctx.arc(-308 + index * 8, -9, 42 - index * 5, -1.28, 1.18);
          ctx.stroke();
        }

        const eyeX = -349;
        const eyeY = -38;
        ctx.globalAlpha = 0.36 + strength * 0.12;
        ctx.strokeStyle = "rgba(255, 190, 225, .92)";
        ctx.lineWidth = 1.05;
        ctx.beginPath();
        ctx.ellipse(eyeX, eyeY, 9.4, 6.8, -0.17, 0, TAU);
        ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 0.84;
        ctx.fillStyle = "rgba(3, 3, 11, .82)";
        ctx.beginPath();
        ctx.ellipse(eyeX, eyeY, 5.4, 4.45, -0.17, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 0.28 + strength * 0.12;
        ctx.fillStyle = "rgba(255, 108, 189, .82)";
        ctx.beginPath();
        ctx.ellipse(eyeX - 0.6, eyeY + 0.2, 2.6, 2.15, -0.17, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.82 + strength * 0.1;
        ctx.fillStyle = "rgba(255, 225, 240, .92)";
        ctx.beginPath();
        ctx.arc(eyeX - 1.55, eyeY - 1.35, 1.28, 0, TAU);
        ctx.fill();
        drawGlowSprite(glowHotPink, eyeX, eyeY, 34, 31, 0.16 + strength * 0.15);

        ctx.globalAlpha = 0.2;
        ctx.strokeStyle = "rgba(255, 222, 240, .72)";
        ctx.lineWidth = 0.75;
        ctx.beginPath();
        ctx.ellipse(eyeX - 1, eyeY - 1.6, 12, 8.4, -0.18, -2.5, -0.5);
        ctx.stroke();

        ctx.globalAlpha = pulse * 0.17;
        ctx.strokeStyle = "rgba(255, 100, 191, .8)";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(-395, -55);
        ctx.lineTo(-366, -47);
        ctx.lineTo(-344, -60);
        ctx.stroke();
        ctx.restore();
      }

      function drawFishSurfaceDetails(fish, time, strength) {
        const detail = clamp(strength + 0.18, 0, 1);
        const hue = fish.hue;
        const wave = Math.sin(time * 1.18 + fish.phase * 1.6);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        // Gill plates and facial seams.
        ctx.strokeStyle = `hsla(${hue - 7}, 100%, 88%, ${0.26 + detail * 0.16})`;
        ctx.lineWidth = 0.8;
        for (let gill = 0; gill < 3; gill++) {
          const baseX = -324 + gill * 11;
          ctx.beginPath();
          ctx.moveTo(baseX, -112 + gill * 4);
          ctx.bezierCurveTo(
            baseX + 24 + gill * 3,
            -61,
            baseX + 25 + gill * 3,
            47,
            baseX - 2,
            93 - gill * 3
          );
          ctx.stroke();
        }

        ctx.globalAlpha = 0.2 + detail * 0.11;
        ctx.strokeStyle = "rgba(222, 252, 255, .9)";
        ctx.beginPath();
        ctx.moveTo(-395, -46);
        ctx.bezierCurveTo(-270, -34, -70, -12, 232, -2);
        ctx.stroke();
        ctx.globalAlpha = 0.13 + detail * 0.07;
        ctx.beginPath();
        ctx.moveTo(-382, 63);
        ctx.bezierCurveTo(-230, 81, -2, 78, 208, 24);
        ctx.stroke();

        const rows = detail > 0.7 ? 7 : 4;
        const columns = detail > 0.7 ? 13 : 8;
        ctx.lineWidth = 0.7;
        for (let row = 0; row < rows; row++) {
          const y = -106 + row * (196 / Math.max(1, rows - 1));
          const stretch = 1 - Math.pow((y + 5) / 232, 2) * 0.26;
          for (let column = 0; column < columns; column++) {
            const x =
              -357 +
              column * (560 / Math.max(1, columns - 1)) +
              (row % 2) * (560 / columns) * 0.5;
            if (x > 226) continue;
            const arcWidth = 12.5 * stretch + Math.sin(row * 1.8 + column) * 1.2;
            const arcHeight = 8.4 * stretch;
            const glint = 0.54 + Math.sin(time * 1.7 + row * 1.9 + column * 0.71) * 0.28;
            ctx.globalAlpha = (0.2 + detail * 0.15) * glint;
            ctx.strokeStyle = (row + column) % 5 === 0
              ? "rgba(215, 254, 255, .95)"
              : `hsla(${hue - 5}, 100%, 88%, .72)`;
            ctx.beginPath();
            ctx.ellipse(x, y, arcWidth, arcHeight, -0.08, 0.13, Math.PI - 0.08);
            ctx.stroke();
          }
        }

        // Fin rays and the suspension line inside the translucent tail.
        ctx.lineCap = "round";
        const tailStrength = 0.105 + detail * 0.095;
        for (const side of [-1, 1]) {
          for (let ray = 0; ray < 8; ray++) {
            const spread = ray / 7;
            const tipX = 305 + spread * 205;
            const tipY =
              side *
              (42 +
                spread * (55 + Math.sin(time * 1.14 + fish.phase + ray * 0.52) * 6));
            ctx.globalAlpha = tailStrength * (1 - spread * 0.22);
            ctx.strokeStyle = ray % 3 === 0
              ? "rgba(228, 254, 255, .9)"
              : `hsla(${hue - 3}, 100%, 82%, .82)`;
            ctx.lineWidth = ray === 2 || ray === 6 ? 0.9 : 0.55;
            ctx.beginPath();
            ctx.moveTo(270, side * 4);
            ctx.bezierCurveTo(
              332,
              side * (28 + spread * 33),
              424,
              side * (65 + spread * 54),
              tipX,
              tipY
            );
            ctx.stroke();
          }
        }

        for (let spine = 0; spine < 5; spine++) {
          const x = -146 + spine * 51;
          const tipY = -151 - Math.sin(time * 1.05 + spine * 0.52 + fish.phase) * 8;
          ctx.globalAlpha = 0.16 + detail * 0.11;
          ctx.strokeStyle = "rgba(220, 254, 255, .86)";
          ctx.lineWidth = 0.55;
          ctx.beginPath();
          ctx.moveTo(x, -139);
          ctx.quadraticCurveTo(x + 8, -171, x + 18, tipY);
          ctx.stroke();
        }

        const shimmerX = -330 + ((time * 155 + fish.phase * 150) % 585);
        const shimmer = ctx.createLinearGradient(shimmerX - 22, 0, shimmerX + 22, 0);
        shimmer.addColorStop(0, "rgba(255, 255, 255, 0)");
        shimmer.addColorStop(0.5, `rgba(213, 253, 255, ${0.1 + detail * 0.11})`);
        shimmer.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.globalAlpha = 1;
        ctx.fillStyle = shimmer;
        ctx.fillRect(shimmerX - 26, -146, 52, 284);

        // Bioluminescent motes peel away from the nose and gill line.
        const moteCount = detail > 0.7 ? 13 : 7;
        for (let mote = 0; mote < moteCount; mote++) {
          const phase = (time * (0.12 + mote * 0.004) + mote * 0.131 + fish.phase * 0.06) % 1;
          const x = -414 - phase * (95 + (mote % 4) * 25);
          const y =
            Math.sin(mote * 2.47 + time * 0.9) * (28 + phase * 38) -
            10 +
            wave * 3;
          ctx.globalAlpha = (1 - phase) * (0.28 + detail * 0.3);
          ctx.fillStyle = mote % 4 === 0
            ? "rgba(160, 250, 255, .92)"
            : "rgba(255, 190, 226, .88)";
          const size = mote % 5 === 0 ? 2.1 : 0.9 + (mote % 3) * 0.3;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFishTrail(fish) {
        if (!fish.trail.length || fish.index !== selectedFish) return;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let index = fish.trail.length - 1; index > 0; index -= 2) {
          const point = fish.trail[index];
          const alpha = (1 - index / fish.trail.length) * 0.055;
          ctx.save();
          ctx.translate(point.x, point.y);
          ctx.rotate(point.rot);
          ctx.scale(point.scale, point.scale);
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = "rgba(255, 112, 197, .75)";
          ctx.lineWidth = 2;
          bodyPath(ctx);
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

      function fishHologramFlicker(fish, time) {
        const cycle =
          (time + fish.index * 2.37 + fish.phase * 5.6 + fish.lanePhase * 3.1) % 15.2;
        let alpha = 1;
        if (cycle < 0.2) {
          const envelope = Math.sin((cycle / 0.2) * Math.PI);
          const strobe = Math.sin(time * 117 + fish.phase * 31) > 0.05 ? 0.9 : 0.42;
          alpha -= envelope * strobe * 0.82;
        }
        const microDropout = Math.pow(
          Math.max(0, Math.sin(time * 2.43 + fish.phase * 13.7)),
          110
        );
        alpha *= 1 - microDropout * 0.1;
        return clamp(alpha, 0.08, 1);
      }

      function drawFish3DAccents(time) {
        const ordered = [...fishSchool].sort((a, b) => a.state.scale - b.state.scale);
        for (const fish of ordered) {
          const selected = fish.index === selectedFish;
          const hovered = pointer.hovering && pointer.fishIndex === fish.index;
          const hologramAlpha = fishHologramFlicker(fish, time);
          const ambientHero = selectedFish < 0 && fish.index === 0;
          const focusFactor =
            selectedFish >= 0 && !selected
              ? 0.34
              : selectedFish < 0 && !ambientHero
                ? 0.72
                : 1;
          const visuals =
            ((selected ? 1 : ambientHero ? 0.92 : 0.72) + (hovered ? 0.12 : 0)) *
            fish.entryFade *
            hologramAlpha *
            focusFactor;
          ctx.save();
          ctx.translate(
            fish.state.x + pointer.sx * (selected ? 3 : 1.5),
            fish.state.y + pointer.sy * 1.2
          );
          ctx.rotate(fish.state.rot);
          ctx.scale(fish.state.scale, fish.state.scale);
          ctx.globalAlpha = visuals;
          ctx.save();
          ctx.translate(-1.1, 0.45);
          ctx.strokeStyle = `hsla(${fish.hue - 172}, 100%, 86%, .2)`;
          ctx.lineWidth = 1.05;
          bodyPath(ctx);
          ctx.stroke();
          ctx.restore();
          ctx.save();
          ctx.translate(1.1, -0.45);
          ctx.strokeStyle = `hsla(${fish.hue + 3}, 100%, 84%, .34)`;
          ctx.lineWidth = 1.25;
          bodyPath(ctx);
          ctx.stroke();
          ctx.restore();
          ctx.strokeStyle = `hsla(${fish.hue - 4}, 100%, 91%, ${0.45 + fish.selectedBlend * 0.18})`;
          ctx.lineWidth = 1.1;
          bodyPath(ctx);
          ctx.stroke();
          drawFishSurfaceDetails(
            fish,
            time,
            fish.index === 0 ? Math.max(0.7, fish.selectedBlend) : fish.selectedBlend
          );
          drawFishFace(ctx, fish, time, fish.selectedBlend);
          if (hologramAlpha < 0.72) {
            const glitchY =
              -138 + ((time * 570 + fish.index * 83 + fish.phase * 91) % 284);
            ctx.globalCompositeOperation = "screen";
            ctx.globalAlpha = (1 - hologramAlpha) * 0.28;
            ctx.fillStyle = "rgba(180, 250, 255, .9)";
            ctx.fillRect(-382, glitchY, 612, 1.15);
            ctx.fillStyle = "rgba(255, 92, 183, .8)";
            ctx.fillRect(-334, glitchY + 3, 368, 0.8);
          }
          ctx.restore();

          if (hovered && !selected) {
            const pulse = 0.55 + Math.sin(time * 4) * 0.2;
            drawGlowSprite(
              glowHotPink,
              fish.state.x,
              fish.state.y,
              96,
              96,
              pulse * 0.12
            );
          }
        }
      }

      function drawFishLayer(time) {
        if (!fish3D) {
          drawFishSchool(time);
          return;
        }

        if (selectedFish >= 0) {
          drawFishTrail(fishSchool[selectedFish]);
        }

        const projectorFish =
          selectedFish >= 0 ? fishSchool[selectedFish] : fishSchool[0];
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const projectorWidth = 240 * projectorFish.state.scale;
        const projector = ctx.createLinearGradient(
          0,
          projectorFish.state.y + 76 * projectorFish.state.scale,
          0,
          731
        );
        projector.addColorStop(0, "rgba(255, 95, 184, .05)");
        projector.addColorStop(0.44, "rgba(255, 102, 188, .018)");
        projector.addColorStop(1, "rgba(79, 226, 247, .035)");
        ctx.fillStyle = projector;
        ctx.beginPath();
        ctx.moveTo(
          projectorFish.state.x - 44 * projectorFish.state.scale,
          projectorFish.state.y + 76 * projectorFish.state.scale
        );
        ctx.lineTo(
          projectorFish.state.x + 236 * projectorFish.state.scale,
          projectorFish.state.y + 48 * projectorFish.state.scale
        );
        ctx.lineTo(projectorFish.state.x + projectorWidth, 731);
        ctx.lineTo(projectorFish.state.x - projectorWidth, 731);
        ctx.closePath();
        ctx.fill();

        for (let mote = 0; mote < 16; mote++) {
          const phase = (time * 0.16 + mote * 0.091) % 1;
          const y = 726 - phase * (726 - projectorFish.state.y - 100 * projectorFish.state.scale);
          const x =
            projectorFish.state.x +
            Math.sin(mote * 2.1 + time * 0.38) * projectorWidth * (1 - phase * 0.55);
          ctx.globalAlpha = Math.sin(phase * Math.PI) * 0.14;
          ctx.fillStyle = mote % 3 ? "rgba(255, 154, 212, .8)" : "rgba(129, 241, 255, .8)";
          ctx.fillRect(x, y, 1.2, 1.2);
        }
        ctx.restore();

        const renderFish = fishSchool.map((fish) => {
          const selected = fish.index === selectedFish;
          const hovered = pointer.hovering && pointer.fishIndex === fish.index;
          const hologramAlpha = fishHologramFlicker(fish, time);
          const ambientHero = selectedFish < 0 && fish.index === 0;
          const focusFactor =
            selectedFish >= 0 && !selected
              ? 0.34
              : selectedFish < 0 && !ambientHero
                ? 0.78
                : 1;
          return {
            x: fish.state.x + pointer.sx * (selected ? 3 : 1.5),
            y: fish.state.y + pointer.sy * 1.2,
            depth: ((fish.index * 37) % 11 - 5) * 19 + (selected ? 74 : 0),
            scale: fish.state.scale,
            roll: fish.state.rot,
            hue: fish.hue,
            phase: fish.phase,
            speed: fish.speed,
            selected,
            opacity:
              fish.entryFade *
              hologramAlpha *
              focusFactor *
              ((selected ? 1 : ambientHero ? 1 : 0.78) + (hovered ? 0.08 : 0))
          };
        });

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const fish of renderFish) {
          const dimmed = selectedFish >= 0 && !fish.selected;
          const ambientHero = selectedFish < 0 && fish.index === 0;
          drawGlowSprite(
            fish.selected ? glowHotPink : glowPink,
            fish.x,
            fish.y,
            900 * fish.scale,
            480 * fish.scale,
            fish.selected ? 0.11 : dimmed ? 0.008 : ambientHero ? 0.07 : 0.028
          );
        }
        ctx.restore();

        fish3D.render(time, renderFish);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 1;
        ctx.drawImage(fish3D.canvas, 0, 0, W, H);
        ctx.restore();
        drawFish3DAccents(time);
      }

      function drawFishSchool(time) {
        const ordered = [...fishSchool].sort((a, b) => a.state.scale - b.state.scale);
        for (const fish of ordered) {
          drawFishTrail(fish);
          const hovered = pointer.hovering && pointer.fishIndex === fish.index;
          const selected = fish.index === selectedFish;
          const hologramAlpha = fishHologramFlicker(fish, time);
          ctx.save();
          ctx.translate(fish.state.x + pointer.sx * (selected ? 3 : 1.5), fish.state.y + pointer.sy * 1.2);
          ctx.rotate(fish.state.rot);
          ctx.scale(fish.state.scale, fish.state.scale);
          ctx.globalAlpha =
            (0.62 + (selected ? 0.38 : 0.1) + (hovered ? 0.12 : 0)) *
            fish.entryFade *
            hologramAlpha;
          drawFishBody(ctx, fish, time, selected, hovered);
          drawFishFins(ctx, fish, time, fish.selectedBlend);
          if (hologramAlpha < 0.72) {
            const glitchY =
              -145 +
              ((time * 570 + fish.index * 83 + fish.phase * 91) % 290);
            ctx.globalCompositeOperation = "screen";
            ctx.globalAlpha = (1 - hologramAlpha) * 0.3;
            ctx.fillStyle = "rgba(180, 250, 255, .9)";
            ctx.fillRect(-375, glitchY, 615, 1.1);
            ctx.fillStyle = "rgba(255, 92, 183, .8)";
            ctx.fillRect(-335, glitchY + 3, 372, 0.8);
          }
          ctx.restore();

          if (hovered && !selected) {
            const pulse = 0.55 + Math.sin(time * 4) * 0.2;
            drawGlowSprite(glowHotPink, fish.state.x, fish.state.y, 92, 92, pulse * 0.12);
          }
        }
      }

      function drawUnderBridge(time) {
        const under = ctx.createLinearGradient(0, 748, 0, H);
        under.addColorStop(0, "rgba(5, 7, 13, .92)");
        under.addColorStop(0.42, "rgba(12, 8, 19, .94)");
        under.addColorStop(0.72, "rgba(7, 4, 13, .98)");
        under.addColorStop(1, "rgba(1, 3, 8, 1)");
        ctx.fillStyle = under;
        ctx.fillRect(0, 744, W, H - 744);

        drawGlowSprite(glowPink, 360, 824, 620, 230, 0.15);
        drawGlowSprite(glowCyan, 1080, 846, 700, 215, 0.13);
      drawGlowSprite(glowPink, 760, 872, 810, 180, 0.082);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let index = 0; index < 46; index++) {
          const x = 42 + ((index * 137) % (W - 80));
          const y = 812 + ((index * 29) % 78);
          const flicker = 0.1 + Math.max(0, Math.sin(time * 0.7 + index * 1.31)) * 0.24;
          ctx.globalAlpha = flicker;
          ctx.fillStyle = index % 5 === 0 ? "rgba(255, 126, 184, .8)" : index % 3 === 0 ? "rgba(255, 181, 112, .65)" : "rgba(76, 209, 235, .58)";
          ctx.fillRect(x, y, 2 + (index % 4) * 1.1, 1);
        }
        ctx.restore();

        drawGlowSprite(glowViolet, 515, 860, 330, 92, 0.045 + Math.sin(time * 0.23) * 0.008);
        drawGlowSprite(glowPink, 1080, 874, 380, 86, 0.04 + Math.cos(time * 0.19) * 0.008);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let index = 0; index < 31; index++) {
          const x = ((index * 107 + time * (4 + (index % 3) * 2)) % 1760) - 80;
          const y = 808 + (index % 5) * 14;
          ctx.strokeStyle = index % 3 ? "rgba(255, 91, 133, .42)" : "rgba(58, 213, 255, .38)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 18, y);
          ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = "rgba(71, 209, 233, .12)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 886);
        ctx.bezierCurveTo(430, 876, 1130, 879, W, 891);
        ctx.stroke();
        for (let index = 0; index < 9; index++) {
          const x = ((time * 18 + index * 189) % (W + 220)) - 110;
          const y = 887 + Math.sin(index * 2.1) * 3;
          ctx.globalAlpha = 0.17 + Math.sin(time * 1.5 + index) * 0.04;
          ctx.fillStyle = index % 3 ? "rgba(255, 155, 106, .8)" : "rgba(81, 227, 248, .8)";
          ctx.fillRect(x, y, 12, 1);
        }
        ctx.restore();

        for (const x of [210, 748, 1264]) {
          // 盖梁 — the cap beam the deck actually rests on. Without it the pier
          // is just a rectangle; with it, the bridge reads as load-bearing.
          const cap = ctx.createLinearGradient(0, 742, 0, 778);
          cap.addColorStop(0, "rgba(13, 18, 27, .92)");
          cap.addColorStop(1, "rgba(3, 6, 12, .96)");
          ctx.fillStyle = cap;
          ctx.fillRect(x - 13, 742, 68, 36);
          ctx.strokeStyle = "rgba(78, 132, 156, .17)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - 13, 742.6);
          ctx.lineTo(x + 55, 742.6);
          ctx.moveTo(x + 55, 777.4);
          ctx.lineTo(x - 13, 777.4);
          ctx.stroke();

          const pillar = ctx.createLinearGradient(x - 18, 778, x + 40, 900);
          pillar.addColorStop(0, "rgba(4, 7, 13, .72)");
          pillar.addColorStop(1, "rgba(1, 3, 8, .98)");
          ctx.fillStyle = pillar;
          ctx.fillRect(x, 776, 42, H - 776);
          ctx.strokeStyle = "rgba(72, 172, 200, .08)";
          ctx.beginPath();
          ctx.moveTo(x + 41, 788);
          ctx.lineTo(x + 58, 900);
          ctx.stroke();

          // 警示斜纹. Every pier on every Chinese overpass has these at the
          // base, and nothing says "infrastructure" faster. The paint is cold
          // blue-white on purpose: the sodium lamps down the deck already own
          // every warm note in this frame, and a hazard-yellow band here was
          // arguing with the skyline for attention.
          ctx.save();
          ctx.beginPath();
          ctx.rect(x, 790, 42, 27);
          ctx.clip();
          const hazardBase = ctx.createLinearGradient(0, 790, 0, 817);
          hazardBase.addColorStop(0, "rgba(4, 9, 17, .55)");
          hazardBase.addColorStop(1, "rgba(2, 5, 11, .92)");
          ctx.fillStyle = hazardBase;
          ctx.fillRect(x, 790, 42, 27);
          for (let stripe = -3; stripe < 9; stripe++) {
            // Worn road-paint blue, not hazard yellow. The pattern is the only
            // thing this needs to say; the colour was the thing that did not.
            ctx.fillStyle = stripe % 2 === 0
              ? "rgba(139, 190, 219, .22)"
              : "rgba(6, 13, 24, .84)";
            ctx.beginPath();
            ctx.moveTo(x + stripe * 11, 817);
            ctx.lineTo(x + stripe * 11 + 11, 817);
            ctx.lineTo(x + stripe * 11 + 11 - 21, 790);
            ctx.lineTo(x + stripe * 11 - 21, 790);
            ctx.closePath();
            ctx.fill();
          }
          // Rain sits on top of this paint, never under it.
          const hazardSheen = ctx.createLinearGradient(x, 790, x + 42, 817);
          hazardSheen.addColorStop(0, "rgba(104, 209, 238, .11)");
          hazardSheen.addColorStop(0.45, "rgba(9, 26, 44, .04)");
          hazardSheen.addColorStop(1, "rgba(0, 3, 9, .5)");
          ctx.fillStyle = hazardSheen;
          ctx.fillRect(x, 790, 42, 27);
          // A lit top edge and a shadow in the joint below give the band the
          // couple of millimetres of thickness it was missing.
          ctx.fillStyle = "rgba(163, 217, 242, .17)";
          ctx.fillRect(x, 790, 42, 1);
          ctx.fillStyle = "rgba(0, 2, 7, .62)";
          ctx.fillRect(x, 815.4, 42, 1.6);
          ctx.restore();

          // Rain has been running down this concrete for years.
          for (let streak = 0; streak < 5; streak++) {
            ctx.fillStyle = `rgba(0, 2, 6, ${0.09 + (streak % 3) * 0.05})`;
            ctx.fillRect(x + 3 + streak * 8, 778, 2.1, H - 786);
          }
          // and someone tagged it. Los Angeles writes on every surface it owns.
          ctx.save();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          const tagInk = ["255, 104, 172", "120, 236, 255", "255, 196, 92"];
          for (let mark = 0; mark < 3; mark++) {
            const tx = x + 5 + mark * 12;
            const ty = 828 + (mark % 2) * 10;
            ctx.strokeStyle = `rgba(${tagInk[(x + mark) % 3]}, .3)`;
            ctx.lineWidth = 2.1;
            ctx.beginPath();
            ctx.moveTo(tx, ty + 9);
            ctx.lineTo(tx + 4, ty);
            ctx.lineTo(tx + 7, ty + 8);
            ctx.lineTo(tx + 11, ty + 2);
            ctx.stroke();
          }
          ctx.restore();
        }

        // 排水管 along the underside, still dripping long after the rain moved
        // on. Nothing sells "this bridge is above a street" like standing water
        // coming off the concrete.
        const pipeY = 792;
        ctx.save();
        const pipe = ctx.createLinearGradient(0, pipeY - 4, 0, pipeY + 5);
        pipe.addColorStop(0, "rgba(9, 14, 22, .95)");
        pipe.addColorStop(0.45, "rgba(22, 34, 44, .9)");
        pipe.addColorStop(1, "rgba(2, 4, 9, .98)");
        ctx.fillStyle = pipe;
        ctx.fillRect(0, pipeY - 4, W, 9);
        ctx.strokeStyle = "rgba(96, 152, 172, .12)";
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(0, pipeY - 4.5);
        ctx.lineTo(W, pipeY - 4.5);
        ctx.stroke();
        for (let hanger = 0; hanger < 8; hanger++) {
          const hx = 90 + hanger * 194;
          ctx.fillStyle = "rgba(6, 10, 16, .9)";
          ctx.fillRect(hx - 3, pipeY - 12, 6, 12);
        }
        ctx.globalCompositeOperation = "lighter";
        for (let bead = 0; bead < 9; bead++) {
          const cycle = (time * 0.42 + bead * 0.31) % 1;
          const bx = 150 + bead * 168;
          const by = pipeY + 4 + cycle * cycle * 74;
          ctx.globalAlpha = (1 - cycle) * 0.16;
          ctx.fillStyle = "rgba(126, 222, 246, 1)";
          ctx.fillRect(bx, by, 1, 3.4);
        }
        ctx.restore();
      }

      function deckTop(x) {
        return 737 - Math.cos((x / W - 0.5) * Math.PI * 0.86) * 5.5;
      }

      function drawBridgeBack(time) {
        const railY = 684;
        ctx.save();

        ctx.strokeStyle = "rgba(74, 218, 238, .25)";
        ctx.lineWidth = 1.15;
        ctx.beginPath();
        ctx.moveTo(0, railY);
        ctx.lineTo(W, railY - 3);
        ctx.stroke();

        ctx.strokeStyle = "rgba(91, 190, 215, .12)";
        for (let x = -10; x < W + 20; x += 74) {
          const top = railY + Math.sin(x * 0.007) * 1.7;
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x + 1, deckTop(x) + 2);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(63, 202, 226, .12)";
        for (let x = 42; x < W; x += 148) {
          ctx.beginPath();
          ctx.moveTo(x + 6, deckTop(x));
          ctx.lineTo(x + 30, railY + 8);
          ctx.stroke();
        }

        const glass = ctx.createLinearGradient(0, railY, 0, deckTop(800));
        glass.addColorStop(0, "rgba(52, 130, 151, .05)");
        glass.addColorStop(1, "rgba(8, 23, 31, .025)");
        ctx.fillStyle = glass;
        ctx.beginPath();
        ctx.moveTo(0, railY + 2);
        ctx.lineTo(W, railY - 1);
        ctx.lineTo(W, deckTop(W));
        ctx.lineTo(0, deckTop(0));
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 83, 165, .18)";
        ctx.lineWidth = 0.8;
        for (const x of [276, 1088, 1318]) {
          ctx.beginPath();
          ctx.moveTo(x, deckTop(x));
          ctx.lineTo(x, railY + 3);
          ctx.stroke();
        }

        drawGlowSprite(glowCyan, 330, 688, 74, 79, 0.1);
        drawGlowSprite(glowPink, 1180, 686, 103, 88, 0.085);

        const lampPositions = [548, 884, 1152];
        for (const [index, x] of lampPositions.entries()) {
          const top = 625 - (index % 2) * 9;
          ctx.strokeStyle = "rgba(3, 7, 12, .95)";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(x, deckTop(x) - 2);
          ctx.lineTo(x, top);
          ctx.lineTo(x + 19, top + 2);
          ctx.stroke();
          ctx.strokeStyle = "rgba(75, 225, 245, .17)";
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(x + 2, deckTop(x));
          ctx.lineTo(x + 2, top);
          ctx.stroke();
          const pulse = 0.7 + Math.sin(time * 1.3 + index * 2.2) * 0.15;
          // Sodium vapour, not mercury. Southern California runs its arterials
          // warm, and that orange against the cyan of the board is the whole
          // warm/cool split the frame is built on.
          drawGlowSprite(glowLamp, x + 19, top + 3, 86, 86, 0.17 * pulse);
          ctx.fillStyle = `rgba(218, 246, 255, ${0.62 * pulse})`;
          ctx.fillRect(x + 17, top, 4, 2);
        }
        ctx.restore();
        drawBridgeGantry(time);
      }

      // The overhead gantry, kept from the earlier pass. The frame is still the
      // one thing that says "this is a road", but the panel it carries is now a
      // magenta hologram instead of a green highway sign — green was the only
      // hue in the file that belonged to nothing.
      function drawBridgeGantry(time) {
        const left = 1078;
        const right = 1428;
        const trussY = 596;
        const signY = 610;
        ctx.save();

        ctx.strokeStyle = "rgba(10, 15, 22, .96)";
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(left + 16, 736);
        ctx.lineTo(left + 16, trussY);
        ctx.moveTo(right - 16, 736);
        ctx.lineTo(right - 16, trussY);
        ctx.stroke();
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(left, trussY);
        ctx.lineTo(right, trussY - 2);
        ctx.moveTo(left, trussY + 9);
        ctx.lineTo(right, trussY + 7);
        ctx.stroke();
        ctx.strokeStyle = "rgba(78, 124, 148, .16)";
        ctx.lineWidth = 1;
        for (let x = left; x < right; x += 26) {
          ctx.beginPath();
          ctx.moveTo(x, trussY + 1);
          ctx.lineTo(x + 22, trussY + 8);
          ctx.stroke();
        }

        const pulse = 0.8 + Math.sin(time * 1.6) * 0.2;
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = `rgba(255, 62, 152, ${0.07 * pulse})`;
        ctx.fillRect(left, signY, right - left, 56);
        ctx.fillStyle = `rgba(112, 220, 255, ${0.035 * pulse})`;
        ctx.fillRect(left + 96, signY, right - left - 96, 56);
        ctx.globalCompositeOperation = "source-over";

        ctx.fillStyle = "rgba(3, 6, 12, .96)";
        ctx.fillRect(left - 6, signY - 4, right - left + 12, 62);
        ctx.strokeStyle = "rgba(255, 96, 178, .34)";
        ctx.lineWidth = 1.2;
        ctx.strokeRect(left + 0.5, signY + 0.5, right - left - 1, 55);

        ctx.fillStyle = "rgba(255, 150, 208, .66) * 1".replace(" * 1", "");
        ctx.fillStyle = "rgba(255, 150, 208, .66)";
        for (let bar = 0; bar < 9; bar++) {
          const shift = ((bar + Math.floor(time * 1.4)) % 9) * 2;
          ctx.fillRect(left + 22 + bar * 11 + shift * 0.4, signY + 12, 5.4, 20);
        }
        ctx.fillRect(left + 22, signY + 40, 86, 3.2);
        ctx.fillStyle = "rgba(126, 224, 255, .5)";
        ctx.beginPath();
        ctx.moveTo(right - 46, signY + 14);
        ctx.lineTo(right - 24, signY + 30);
        ctx.lineTo(right - 46, signY + 30);
        ctx.closePath();
        ctx.fill();

        ctx.globalCompositeOperation = "lighter";
        drawGlowSprite(glowHotPink, (left + right) / 2, signY + 28, 420, 130, 0.045 * pulse);
        ctx.restore();
      }

      function drawBridgeDeck(time) {
        ctx.save();

        const deckGradient = ctx.createLinearGradient(0, 728, 0, 785);
        deckGradient.addColorStop(0, "rgba(13, 18, 28, .99)");
        deckGradient.addColorStop(0.22, "rgba(8, 12, 21, .995)");
        deckGradient.addColorStop(1, "rgba(2, 5, 10, .995)");
        ctx.fillStyle = deckGradient;
        ctx.beginPath();
        ctx.moveTo(-90, 727);
        ctx.lineTo(0, deckTop(0));
        ctx.bezierCurveTo(420, 726, 1180, 726, W, deckTop(W));
        ctx.lineTo(W + 90, 727);
        ctx.lineTo(W + 90, 786);
        ctx.lineTo(-90, 786);
        ctx.closePath();
        ctx.fill();

        const surface = ctx.createLinearGradient(0, 727, 0, 756);
        surface.addColorStop(0, "rgba(26, 36, 52, .25)");
        surface.addColorStop(0.5, "rgba(15, 21, 34, .45)");
        surface.addColorStop(1, "rgba(4, 8, 15, 0)");
        ctx.fillStyle = surface;
        ctx.fillRect(0, 726, W, 34);

        ctx.strokeStyle = "rgba(84, 228, 248, .2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, deckTop(0) + 2);
        ctx.bezierCurveTo(400, 729, 1200, 729, W, deckTop(W) + 2);
        ctx.stroke();

        const edgeGradient = ctx.createLinearGradient(0, 755, 0, 783);
        edgeGradient.addColorStop(0, "rgba(57, 138, 158, .12)");
        edgeGradient.addColorStop(0.35, "rgba(255, 64, 156, .035)");
        edgeGradient.addColorStop(1, "rgba(0, 2, 6, .8)");
        ctx.fillStyle = edgeGradient;
        ctx.fillRect(0, 757, W, 29);

        ctx.strokeStyle = "rgba(255, 84, 172, .22)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 779);
        ctx.lineTo(W, 775);
        ctx.stroke();

        ctx.globalCompositeOperation = "lighter";
        const reflectionOffsets = [
          { x: 150, width: 26, color: "rgba(255, 63, 151, .09)", phase: 0.4 },
          { x: 520, width: 40, color: "rgba(65, 225, 255, .055)", phase: 1.2 },
          { x: 890, width: 22, color: "rgba(255, 67, 160, .07)", phase: 2.3 },
          { x: 1355, width: 52, color: "rgba(255, 117, 71, .045)", phase: 1.8 }
        ];

        for (const reflection of reflectionOffsets) {
          const sway = Math.sin(time * 0.9 + reflection.phase) * 7;
          const reflected = ctx.createLinearGradient(0, 731, 0, 772);
          reflected.addColorStop(0, reflection.color);
          reflected.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = reflected;
          ctx.beginPath();
          ctx.ellipse(reflection.x + sway, 748, reflection.width, 23, -0.04, 0, TAU);
          ctx.fill();
        }

        for (let index = 0; index < 26; index++) {
          const cycle = (time * 0.55 + index * 0.173) % 1;
          const x = 40 + index * 61 + Math.sin(index * 4.1) * 17;
          const y = 740 + (index % 5) * 5;
          ctx.globalAlpha = (1 - cycle) * 0.22;
          ctx.strokeStyle = index % 3 ? "rgba(178, 226, 235, .5)" : "rgba(255, 117, 190, .5)";
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.ellipse(x, y, 2 + cycle * 12, 0.8 + cycle * 1.8, 0, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
      }

      const deckImpactRandom = mulberry32(977);
      const deckImpacts = Array.from({ length: 38 }, (_, index) => ({
        x: randomRange(deckImpactRandom, 24, W - 24),
        y: randomRange(deckImpactRandom, 737, 764),
        depth: deckImpactRandom(),
        phase: deckImpactRandom(),
        speed: randomRange(deckImpactRandom, 0.42, 0.82),
        index
      }));

      function drawDeckRainImpacts(time) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";

        for (const impact of deckImpacts) {
          const cycle = (time * impact.speed + impact.phase) % 1;
          if (cycle > 0.44) continue;

          const life = cycle / 0.44;
          const radius = 1.2 + life * (8 + impact.depth * 18);
          const alpha = (1 - life) * (0.07 + impact.depth * 0.12);
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = impact.index % 4
            ? "rgba(150, 224, 239, .82)"
            : "rgba(255, 139, 195, .72)";
          ctx.lineWidth = 0.55 + impact.depth * 0.55;
          ctx.beginPath();
          ctx.ellipse(
            impact.x,
            impact.y,
            radius,
            radius * (0.24 + impact.depth * 0.08),
            0,
            0,
            TAU
          );
          ctx.stroke();

          if (life < 0.32) {
            const burst = Math.sin((life / 0.32) * Math.PI);
            ctx.globalAlpha = alpha * 0.9;
            for (let spark = 0; spark < 3; spark++) {
              const spread = (spark - 1) * 3.4;
              ctx.beginPath();
              ctx.moveTo(impact.x + spread * 0.4, impact.y - 1);
              ctx.lineTo(
                impact.x + spread * (0.8 + life * 2.4),
                impact.y - burst * (4 + spark * 1.8)
              );
              ctx.stroke();
            }
          }
        }

        const wetGlow = ctx.createLinearGradient(0, 733, 0, 770);
        wetGlow.addColorStop(0, "rgba(80, 220, 244, .035)");
        wetGlow.addColorStop(0.42, "rgba(255, 76, 164, .026)");
        wetGlow.addColorStop(1, "rgba(255, 180, 122, .012)");
        ctx.globalAlpha = 1;
        ctx.fillStyle = wetGlow;
        ctx.fillRect(0, 732, W, 40);
        ctx.restore();
      }

      function drawBridgeLighting(time) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const lamps = [
          { x: 567, y: 629, tint: "83, 232, 249", power: 1 },
          { x: 903, y: 620, tint: "88, 224, 249", power: 0.82 },
          { x: 1171, y: 629, tint: "255, 92, 177", power: 0.68 }
        ];

        for (const [index, lamp] of lamps.entries()) {
          const pulse = 0.82 + Math.sin(time * 1.3 + index * 2.2) * 0.1;
          const cone = ctx.createLinearGradient(lamp.x, lamp.y, lamp.x + 10, 754);
          cone.addColorStop(0, `rgba(${lamp.tint}, ${0.05 * lamp.power * pulse})`);
          cone.addColorStop(0.55, `rgba(${lamp.tint}, ${0.018 * lamp.power})`);
          cone.addColorStop(1, `rgba(${lamp.tint}, 0)`);
          ctx.fillStyle = cone;
          ctx.beginPath();
          ctx.moveTo(lamp.x + 15, lamp.y + 2);
          ctx.lineTo(lamp.x - 72, 754);
          ctx.lineTo(lamp.x + 105, 756);
          ctx.closePath();
          ctx.fill();

          ctx.globalAlpha = 0.11 * lamp.power * pulse;
          ctx.fillStyle = `rgba(${lamp.tint}, .7)`;
          ctx.beginPath();
          ctx.ellipse(lamp.x + 16, 748, 62, 9, -0.02, 0, TAU);
          ctx.fill();
        }

        const railShadow = ctx.createLinearGradient(0, 680, 0, 756);
        railShadow.addColorStop(0, "rgba(0, 1, 4, .34)");
        railShadow.addColorStop(0.42, "rgba(0, 1, 4, .13)");
        railShadow.addColorStop(1, "rgba(0, 1, 4, 0)");
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.fillStyle = railShadow;
        for (let x = -16; x < W + 50; x += 74) {
          ctx.beginPath();
          ctx.moveTo(x, 690);
          ctx.lineTo(x + 8, 690);
          ctx.lineTo(x + 38, 756);
          ctx.lineTo(x + 24, 756);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      // ── Contact shadows and occlusion ────────────────────────────────────
      // Every object in this scene was sitting on the deck like a sticker, and
      // that single omission is louder than any missing reflection or lens
      // effect, because it is the one cue that says an object is touching a
      // surface instead of hovering near it.
      //
      // A contact shadow is not a dark ellipse. It is two separate things and
      // you need both: a tight ambient-occlusion core right where the object
      // meets the ground, where no light can reach because it is boxed in, and
      // a directional cast that stretches *away* from the light, growing and
      // thinning as it goes. Draw only the first and you get a sticker with a
      // smudge; draw only the second and you get a floating smudge.
      //
      // Deliberately local. Everything here paints onto the walkway and does
      // nothing else — no global pass, no buffer, no change to the exposure of
      // the frame as a whole. That is the whole reason it is safe.

      // Three overlapping bodies with falling alpha and rising radius. One
      // stretched ellipse reads as a blur; three read as a penumbra, which is
      // what a shadow physically is — no hard edge until it hits the surface.
      function castShadow(cx, cy, radius, dirX, dirY, reach, alpha) {
        const angle = Math.atan2(dirY, dirX);
        for (let step = 0; step < 3; step++) {
          const d = reach * (0.22 + step * 0.3);
          const grow = 1 + step * 0.55;
          const fade = alpha * (1 - step * 0.3);
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * grow);
          grad.addColorStop(0, `rgba(0, 2, 7, ${fade})`);
          grad.addColorStop(0.5, `rgba(0, 2, 7, ${fade * 0.42})`);
          grad.addColorStop(1, "rgba(0, 2, 7, 0)");
          ctx.save();
          ctx.translate(cx + Math.cos(angle) * d, cy + Math.sin(angle) * d);
          ctx.rotate(angle);
          ctx.scale(1, 0.4);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, radius * grow, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }

      // The occlusion core: light-tight, tight to the ground plane, and much
      // narrower across the plane than along it, because the walkway is seen
      // almost edge-on from here.
      function occlusionPool(cx, cy, radius, alpha) {
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
        grad.addColorStop(0, `rgba(0, 2, 6, ${alpha})`);
        grad.addColorStop(0.45, `rgba(0, 2, 6, ${alpha * 0.55})`);
        grad.addColorStop(1, "rgba(0, 2, 6, 0)");
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, 0.34);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawContactShadows(time) {
        ctx.save();
        ctx.globalCompositeOperation = "source-over";

        // Every object is thrown away from whichever lamp standard reaches it
        // first. The deck lamps sit up at ~620-630 and the deck is at ~732, so
        // the cast shadows run right and down — toward the viewer and away from
        // the lamp — which is what a raking overhead light does on a surface
        // you are looking at edge-on.
        const lamps = [
          { x: 567, y: 629 },
          { x: 903, y: 620 },
          { x: 1171, y: 629 }
        ];

        // She already owns an occlusion pool of her own inside drawWomanBack,
        // so she only gets the cast here — two cores in the same place is the
        // one thing that would make her look welded to the floor.
        castShadow(717, 741, 17, 717 - 567, 741 - 629, 74, 0.3);

        const spinnerGround = 729;
        occlusionPool(645, spinnerGround, 44, 0.4);
        castShadow(645, spinnerGround, 26, 645 - 567, spinnerGround - 629, 44, 0.24);

        for (const legX of [1094, 1412]) {
          occlusionPool(legX, 733, 16, 0.48);
          castShadow(legX, 733, 9, legX - 1171, 733 - 629, 42, 0.28);
        }

        for (const lamp of lamps) {
          const footY = deckTop(lamp.x);
          occlusionPool(lamp.x, footY, 14, 0.5);
          castShadow(lamp.x, footY, 7, lamp.x - 760, footY - lamp.y, 30, 0.22);
        }

        ctx.restore();
      }

      // A street this wet should be standing in its own light. The billboard is
      // the brightest thing in the frame, so the walkway is where his reflection
      // finally reaches her — torn into strips, because still water is the one
      // thing that would look wrong here.
      // Everything here is deliberately un-cool. A 井盖 and an 空调外机 do more
      // for believability than another neon sign, because the whole grammar of
      // cyberpunk is high tech sitting shoulder to shoulder with junk.
      function drawStreetGrime(time) {
        ctx.save();

        // ── paving slabs. A walkway is not a flat colour field; it is a grid of
        // slabs, and in weather like this every joint holds water.
        const paveTop = deckTop(800) + 3;
        ctx.strokeStyle = "rgba(0, 3, 8, .3)";
        ctx.lineWidth = 0.8;
        for (let row = 0; row < 2; row++) {
          const y = paveTop + 9 + row * 14;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y - 2);
          ctx.stroke();
        }
        for (let slab = 0; slab < 36; slab++) {
          const x = slab * 45;
          ctx.beginPath();
          ctx.moveTo(x, paveTop + 9);
          ctx.lineTo(x - 0.6, paveTop + 23);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x + 22.5, paveTop + 23);
          ctx.lineTo(x + 21.9, paveTop + 37);
          ctx.stroke();
        }

        // ── expansion joints across the deck
        ctx.fillStyle = "rgba(2, 5, 11, .55)";
        for (const jointX of [612, 1042]) {
          ctx.fillRect(jointX, 727, 1.6, 60);
        }

        // ── 盲道. Faded yellow in the real world; here it borrows the same
        // amber that finds her, so the one warm thing on the ground belongs
        // to her.
        // ── 盲道. Faded amber in the real world; here the whole band goes cold
        // blue-violet. It runs the full width of the frame and it is the one
        // thing on the ground that must not compete with her for warmth. It
        // also stops being a flat stripe with pale ticks on it: the band gets
        // its own lit lip and its own shadow, every bar is seated in a recess,
        // and one translucent sheet of standing water lies over both so the
        // pattern reads as being *under* something.
        const tactileY = 762;
        const tactileH = 17;
        ctx.save();

        // ① The slab the bars are cut into. Cool violet-black, lit from the
        // kerb side and falling away toward the road.
        const tactileBase = ctx.createLinearGradient(0, tactileY, 0, tactileY + tactileH);
        tactileBase.addColorStop(0, "rgba(48, 43, 82, .62)");
        tactileBase.addColorStop(0.34, "rgba(27, 25, 56, .5)");
        tactileBase.addColorStop(1, "rgba(9, 10, 27, .72)");
        ctx.fillStyle = tactileBase;
        ctx.fillRect(0, tactileY, W, tactileH);

        // ② The bars. Three passes each — recess shadow, the bar, then a lit
        // top edge. Cheap enough to do 128 times, and it is the difference
        // between bars painted on a stripe and bars standing up off one.
        for (let bar = 0; bar < 128; bar++) {
          const bx = 12 + bar * 12.4;
          ctx.fillStyle = "rgba(4, 6, 18, .5)";
          ctx.fillRect(bx - 0.7, tactileY + 1.5, 7.8, tactileH - 1.5);
          ctx.fillStyle = "rgba(148, 176, 226, .13)";
          ctx.fillRect(bx, tactileY + 2, 6.4, 13);
          ctx.fillStyle = "rgba(188, 174, 246, .12)";
          ctx.fillRect(bx, tactileY + 2, 6.4, 0.9);
        }

        // ③ Standing water across the strip, violet on the far side where it
        // picks up the board and clear where the lamps hit it.
        const tactileWet = ctx.createLinearGradient(0, tactileY, W, tactileY + tactileH);
        tactileWet.addColorStop(0, "rgba(124, 166, 236, .09)");
        tactileWet.addColorStop(0.42, "rgba(92, 74, 168, .05)");
        tactileWet.addColorStop(1, "rgba(182, 156, 255, .07)");
        ctx.fillStyle = tactileWet;
        ctx.fillRect(0, tactileY, W, tactileH);

        // ④ The two millimetres that make it an object.
        ctx.fillStyle = "rgba(180, 200, 248, .12)";
        ctx.fillRect(0, tactileY, W, 1);
        ctx.fillStyle = "rgba(0, 1, 8, .55)";
        ctx.fillRect(0, tactileY + tactileH - 1.2, W, 1.2);
        ctx.restore();

        // ── puddles, because nothing this wide stays flat in a storm
        const puddles = [
          [372, 748, 58, 7, 0.02],
          [812, 771, 84, 8.5, 0.015],
          [1296, 745, 46, 5.5, 0.024]
        ];
        for (const [px, py, rx, ry, gloss] of puddles) {
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = "rgba(1, 3, 9, .42)";
          ctx.beginPath();
          ctx.ellipse(px, py, rx, ry, -0.015, 0, TAU);
          ctx.fill();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = `rgba(120, 226, 246, ${gloss})`;
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          ctx.ellipse(px, py, rx * 0.94, ry * 0.9, -0.015, 3.5, 5.7);
          ctx.stroke();
          const sheen = ctx.createLinearGradient(px - rx, py, px + rx, py);
          sheen.addColorStop(0, `rgba(255, 116, 190, ${gloss * 0.7})`);
          sheen.addColorStop(0.55, "rgba(255, 116, 190, 0)");
          sheen.addColorStop(1, `rgba(120, 226, 246, ${gloss * 0.6})`);
          ctx.fillStyle = sheen;
          ctx.beginPath();
          ctx.ellipse(px, py, rx, ry, -0.015, 0, TAU);
          ctx.fill();
        }

        // ── 井盖
        const lidY = 768;
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(6, 9, 16, .82)";
        ctx.beginPath();
        ctx.ellipse(944, lidY, 25, 6.4, -0.02, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(96, 128, 146, .17)";
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.ellipse(944, lidY, 25, 6.4, -0.02, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = "rgba(88, 116, 134, .11)";
        for (let rib = -2; rib <= 2; rib++) {
          ctx.beginPath();
          ctx.moveTo(944 - 18, lidY + rib * 2.1);
          ctx.lineTo(944 + 18, lidY + rib * 2.1);
          ctx.stroke();
        }

        // ── the mist that lives in the first twenty centimetres above wet
        // stone, where every impact throws water back up
        const bounce = ctx.createLinearGradient(0, 716, 0, 752);
        bounce.addColorStop(0, "rgba(150, 196, 222, 0)");
        bounce.addColorStop(0.55, "rgba(150, 196, 222, .026)");
        bounce.addColorStop(1, "rgba(150, 196, 222, 0)");
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = bounce;
        ctx.fillRect(0, 716, W, 36);

        ctx.restore();
      }

      // 空调外机: the single most recognisable object on a Chinese street, and
      // in this palette it earns its keep twice — it is a light source, and it
      // drips.
      function drawAcUnits(time) {
        const units = [
          [1442, 336, 30, 21, 0],
          [1496, 424, 27, 19, 1.7],
          [1436, 512, 25, 17.5, 3.4]
        ];
        ctx.save();
        for (const [ux, uy, uw, uh, phase] of units) {
          const bracket = ctx.createLinearGradient(0, uy, 0, uy + uh + 5);
          bracket.addColorStop(0, "rgba(0, 2, 6, 0)");
          bracket.addColorStop(1, "rgba(0, 2, 6, .55)");
          ctx.fillStyle = bracket;
          ctx.fillRect(ux - 2, uy, uw + 4, uh + 5);

          ctx.fillStyle = "rgba(9, 14, 22, .9)";
          ctx.fillRect(ux, uy, uw, uh);
          ctx.strokeStyle = "rgba(84, 132, 152, .2)";
          ctx.lineWidth = 0.8;
          ctx.strokeRect(ux + 0.4, uy + 0.4, uw - 0.8, uh - 0.8);

          const spin = time * 1.9 + phase;
          ctx.save();
          ctx.beginPath();
          ctx.rect(ux + 2, uy + 2, uw * 0.62, uh - 4);
          ctx.clip();
          ctx.strokeStyle = "rgba(96, 142, 162, .17)";
          ctx.lineWidth = 0.7;
          for (let blade = 0; blade < 3; blade++) {
            const angle = spin + (blade / 3) * TAU;
            ctx.beginPath();
            ctx.moveTo(ux + 2 + (uw * 0.62) / 2, uy + uh / 2);
            ctx.lineTo(
              ux + 2 + (uw * 0.62) / 2 + Math.cos(angle) * (uw * 0.32),
              uy + uh / 2 + Math.sin(angle) * (uh * 0.42)
            );
            ctx.stroke();
          }
          ctx.restore();

          const live = Math.sin(time * 2.4 + phase) > 0.35;
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = live ? "rgba(120, 244, 255, .8)" : "rgba(70, 150, 168, .28)";
          ctx.fillRect(ux + uw - 4.5, uy + 3, 2.2, 2.2);
          if (live) {
            drawGlowSprite(glowCyan, ux + uw - 3.4, uy + 4, 16, 12, 0.1);
          }

          // condensation finding the one place it can go
          const dripCycle = (time * 0.72 + phase * 1.6) % 1;
          if (dripCycle > 0.45) {
            const fall = (dripCycle - 0.45) / 0.55;
            ctx.fillStyle = `rgba(150, 226, 246, ${(1 - fall) * 0.22})`;
            ctx.fillRect(ux + uw * 0.22, uy + uh + fall * 22, 0.9, 2.6);
          }
          ctx.globalCompositeOperation = "source-over";
        }

      }

      // ── The slope field of the wet ground ────────────────────────────────
      // Every reflection in this scene is broken up by the same surface, so the
      // surface gets one function and everybody shares it. Three sines at
      // incommensurate frequencies: a single sine reads as a wobble, two read
      // as a loop you can spot, three read as water and never visibly repeat.
      function rippleAt(x, y, time) {
        return (
          Math.sin(x * 0.031 + time * 1.7 + y * 0.09) * 0.55 +
          Math.sin(x * 0.017 - time * 1.15 + y * 0.21) * 0.35 +
          Math.sin(x * 0.073 + time * 2.6 - y * 0.13) * 0.18
        );
      }

      function drawStreetReflections(time) {
        const deck = 729;
        const breathe = 0.82 + Math.sin(time * 1.42) * 0.18;
        ctx.save();

        if (pixelBillboard) {
          const strips = 26;
          const reflectX = 546;
          const reflectW = 344;
          const reflectH = 46;
          const spriteH = pixelBillboard.sprite.height;
          const spriteW = pixelBillboard.sprite.width;
          ctx.globalCompositeOperation = "lighter";
          for (let strip = 0; strip < strips; strip++) {
            const t0 = strip / strips;
            const t1 = (strip + 0.92) / strips;
            // The inversion *is* the reflection: row zero of the reflection is
            // the bottom row of the panel, and every step down the ground walks
            // one step back up it.
            const srcY = Math.round((1 - t1) * spriteH);
            const srcH = Math.max(1, Math.round((t1 - t0) * spriteH));
            const y = deck + t0 * reflectH;
            // Each strip is displaced by its own local slope rather than by one
            // shared wobble, and the displacement grows with distance from the
            // contact point.
            const dx = rippleAt(strip * 9.3, y, time) * (1.1 + t0 * 4.4);
            // Fresnel: reflectance climbs as the viewing ray flattens toward the
            // surface, so the reflection is strongest where the panel touches
            // the ground and is gone before it reaches the camera.
            const fresnel = Math.pow(1 - t0, 1.55);
            ctx.globalAlpha = 0.19 * fresnel * (0.72 + breathe * 0.28);
            ctx.drawImage(
              pixelBillboard.sprite,
              0,
              srcY,
              spriteW,
              srcH,
              reflectX + dx,
              y,
              reflectW,
              reflectH / strips + 1
            );
            // Roughness: past halfway the water can no longer resolve the
            // image, so each strip is laid down again a pixel and a half either
            // side at half weight.
            if (t0 > 0.45) {
              ctx.globalAlpha *= 0.42;
              ctx.drawImage(pixelBillboard.sprite, 0, srcY, spriteW, srcH,
                reflectX + dx - 1.6, y, reflectW, reflectH / strips + 1);
              ctx.drawImage(pixelBillboard.sprite, 0, srcY, spriteW, srcH,
                reflectX + dx + 1.6, y, reflectW, reflectH / strips + 1);
            }
          }
          // Where the film is momentarily flat it stops reflecting the panel
          // and starts reflecting the dark underside of the deck instead.
          ctx.globalCompositeOperation = "source-over";
          for (let cut = 0; cut < 5; cut++) {
            const y = deck + ((time * 13 + cut * 47) % reflectH);
            const near = 1 - (y - deck) / reflectH;
            ctx.globalAlpha = 0.34 * Math.pow(near, 0.7);
            ctx.fillStyle = "rgba(2, 5, 12, 1)";
            ctx.fillRect(
              reflectX - 10 + rippleAt(cut * 31, y, time) * 3,
              y,
              reflectW + 20,
              1.2
            );
          }
        }

        // She is the only warm thing on the ground and the only thing on it
        // with a silhouette worth reflecting. She gets the same treatment as
        // the billboard — scanline by scanline, each displaced by the local
        // slope and weighted by Fresnel — because a mirror that is flat for one
        // object and wobbly for another gives the whole trick away.
        const wobble = rippleAt(714, 4, time) * 2;
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        const rows = 34;
        for (let row = 0; row < rows; row++) {
          const t = row / rows;
          const y = 742 + row;
          const halfWidth = 13 * Math.sin(Math.pow(t, 0.62) * Math.PI * 0.92);
          if (halfWidth <= 0.2) continue;
          const dx = rippleAt(row * 7.7, y, time) * (0.9 + t * 3.4);
          ctx.fillStyle = "rgba(2, 4, 9, " + (0.72 * Math.pow(1 - t, 1.45)).toFixed(3) + ")";
          ctx.fillRect(714 + wobble + dx - halfWidth, y, halfWidth * 2, 1.15);
        }
        // The amber key behind her lands on the same water, so it lands on it
        // the same way — a thin displaced streak, not a blob.
        ctx.globalCompositeOperation = "lighter";
        for (let row = 0; row < 22; row++) {
          const t = row / 22;
          const y = 748 + row;
          const halfWidth = 3 * Math.sin(Math.pow(t, 0.7) * Math.PI * 0.95);
          if (halfWidth <= 0.15) continue;
          const dx = rippleAt(row * 5.3 + 40, y, time) * (0.8 + t * 2.8);
          ctx.globalAlpha = (0.15 + breathe * 0.06) * Math.pow(1 - t, 1.4);
          ctx.fillStyle = "rgba(150, 226, 246, 1)";
          ctx.fillRect(732 + wobble * 1.3 + dx - halfWidth, y, halfWidth * 2, 1.1);
        }

        // And finally the surface itself. At the far lip of the walkway the
        // viewing ray is nearly parallel to the ground, so Fresnel is at its
        // maximum and the band behaves like a mirror; nearer the camera the same
        // film goes matte. One gradient, and it is what makes the wet deck
        // recede instead of reading as a painted stripe.
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 1;
        const grazing = ctx.createLinearGradient(0, 726, 0, 758);
        grazing.addColorStop(0, "rgba(112, 198, 230, .055)");
        grazing.addColorStop(0.35, "rgba(126, 168, 236, .022)");
        grazing.addColorStop(1, "rgba(150, 140, 255, 0)");
        ctx.fillStyle = grazing;
        ctx.fillRect(0, 726, W, 32);

        ctx.restore();
      }
