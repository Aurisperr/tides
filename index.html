        };
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(730, 602 + breath);
        ctx.bezierCurveTo(
          lerp(714, 739, reach),
          lerp(616, 591, reach) + breath * 0.4,
          elbow.x,
          elbow.y + breath * 0.35,
          hand.x,
          hand.y
        );
        ctx.stroke();
        ctx.strokeStyle = "rgba(255, 97, 181, .56)";
        ctx.lineWidth = 0.78;
        ctx.beginPath();
        ctx.moveTo(732, 600 + breath);
        ctx.bezierCurveTo(
          lerp(715, 740, reach),
          lerp(614, 590, reach) + breath * 0.35,
          elbow.x + 1.2,
          elbow.y + 1.5,
          hand.x,
          hand.y + 2.2
        );
        ctx.stroke();

        // Left arm holds the umbrella.
        ctx.strokeStyle = black;
        ctx.lineWidth = 4.8;
        ctx.beginPath();
        ctx.moveTo(706, 603 + breath);
        ctx.bezierCurveTo(698, 617, 695, 632, 691, 640 + breath);
        ctx.stroke();
        ctx.fillStyle = black;
        ctx.beginPath();
        ctx.ellipse(691, 641 + breath, 3.1, 5.4, 0.2, 0, TAU);
        ctx.fill();

        // Broad, low-opacity rim strokes describe the body under two nearby
        // colored sources: cool screen light from the left, fish glow from the
        // right.
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";
        ctx.strokeStyle = `rgba(255, 95, 179, ${0.055 + contactGlow * 0.07})`;
        ctx.lineWidth = 5.2;
        ctx.beginPath();
        ctx.moveTo(729, 603 + breath);
        ctx.bezierCurveTo(735, 620, 733, 635, 727, 641);
        ctx.bezierCurveTo(735, 656, 738, 671, 744 + skirtSway * 0.4, 668);
        ctx.stroke();
        ctx.strokeStyle = "rgba(80, 230, 249, .05)";
        ctx.lineWidth = 4.2;
        ctx.beginPath();
        ctx.moveTo(705, 604 + breath);
        ctx.bezierCurveTo(699, 620, 701, 635, 707, 641);
        ctx.bezierCurveTo(702, 650, 699, 660, 694 + skirtSway, 669);
        ctx.stroke();
        ctx.restore();

        drawUmbrella(time, contactGlow);

        drawGlowSprite(
          glowHotPink,
          hand.x,
          hand.y,
          52,
          52,
          0.055 + reach * 0.11 + contactGlow * 0.26
        );
        ctx.globalAlpha = 0.48 + reach * 0.43 + contactGlow * 0.08;
        ctx.fillStyle = "rgba(255, 216, 237, .9)";
        ctx.beginPath();
        ctx.arc(hand.x, hand.y, 1.4 + reach * 0.45 + contactGlow * 1.05, 0, TAU);
        ctx.fill();

        ctx.restore();
        return hand;
      }

      function drawUmbrella(time, contactGlow) {
        ctx.save();
        ctx.globalCompositeOperation = "source-over";

        const gripX = 691;
        const gripY = 642;
        const topX = 677;
        const topY = 506;
        const umbrellaTilt = -0.16 + Math.sin(time * 0.43) * 0.012;

        // Keep the grip anchored while shortening the umbrella by 20% and
        // tilting the whole canopy into the rain-wind.
        ctx.translate(gripX, gripY);
        ctx.rotate(umbrellaTilt);
        ctx.scale(1, 0.8);
        ctx.translate(-gripX, -gripY);

        ctx.strokeStyle = "rgba(3, 6, 11, .96)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gripX, gripY);
        ctx.lineTo(topX, topY);
        ctx.stroke();
        ctx.strokeStyle = "rgba(93, 232, 249, .18)";
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(gripX - 1, gripY);
        ctx.lineTo(topX - 1, topY);
        ctx.stroke();

        const canopy = new Path2D();
        canopy.moveTo(614, 521);
        canopy.quadraticCurveTo(644, 470, 680, 470);
        canopy.quadraticCurveTo(722, 470, 748, 525);
        canopy.closePath();

        const canopyGradient = ctx.createLinearGradient(620, 472, 744, 526);
        canopyGradient.addColorStop(0, "rgba(13, 19, 33, .42)");
        canopyGradient.addColorStop(0.5, "rgba(19, 14, 34, .34)");
        canopyGradient.addColorStop(1, "rgba(9, 14, 26, .48)");
        ctx.fillStyle = canopyGradient;
        ctx.fill(canopy);

        ctx.save();
        ctx.clip(canopy);
        const holo = ctx.createLinearGradient(616, 470, 744, 526);
        holo.addColorStop(0, "rgba(94, 232, 251, .16)");
        holo.addColorStop(0.55, "rgba(255, 71, 174, .1)");
        holo.addColorStop(1, "rgba(255, 125, 194, .2)");
        ctx.fillStyle = holo;
        ctx.fillRect(612, 466, 140, 62);
        ctx.globalCompositeOperation = "lighter";
        for (let line = 0; line < 5; line++) {
          const y = 474 + line * 10;
          ctx.globalAlpha = 0.16 - line * 0.018;
          ctx.fillStyle = "rgba(132, 241, 255, .7)";
          ctx.fillRect(614, y, 132, 0.7);
        }
        ctx.restore();

        ctx.save();
        ctx.clip(canopy);
        ctx.globalCompositeOperation = "lighter";
        for (let rib = 0; rib < 6; rib++) {
          const x = 618 + rib * 26;
          const t = (x - 614) / 134;
          const edgeY =
            (1 - t) * (1 - t) * 521 + 2 * (1 - t) * t * 470 + t * t * 525;
          ctx.globalAlpha = 0.34 - rib * 0.022;
          ctx.strokeStyle = rib % 2 ? "rgba(255, 88, 179, .8)" : "rgba(105, 236, 252, .75)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(topX, topY);
          ctx.quadraticCurveTo((topX + x) / 2, 484, x, edgeY);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "rgba(255, 197, 224, .9)";
        ctx.beginPath();
        ctx.arc(745, 523, 2, 0, TAU);
        ctx.fill();
        drawGlowSprite(glowHotPink, 746, 524, 20, 16, 0.08);
        ctx.restore();

        // Rain landing on the canopy. The rim already sheds water, but without
        // impacts up here the surface is just a translucent decal — these give
        // it somewhere for the rain to actually happen.
        ctx.save();
        ctx.clip(canopy);
        ctx.globalCompositeOperation = "lighter";
        for (let hit = 0; hit < 10; hit++) {
          // Walk the real dome (two quadratics) instead of the rib
          // approximation, so every impact actually lands on the fabric.
          const u = 0.06 + ((hit * 41) % 88) / 100;
          const left = u < 0.5;
          const v = left ? u * 2 : (u - 0.5) * 2;
          const px0 = left ? 614 : 680;
          const px1 = left ? 644 : 722;
          const px2 = left ? 680 : 748;
          const py0 = left ? 521 : 470;
          const py1 = 470;
          const py2 = left ? 470 : 525;
          const inv = 1 - v;
          const hx = inv * inv * px0 + 2 * inv * v * px1 + v * v * px2;
          const domeY = inv * inv * py0 + 2 * inv * v * py1 + v * v * py2;
          const hemY = 521 + ((hx - 614) / 134) * 4;
          const hy = domeY + 2.5 + (((hit * 37) % 100) / 100) * Math.max(1, hemY - domeY - 5);
          const cycle = 0.86 + (((hit * 29) % 7) * 0.17);
          const phase = (time / cycle + hit * 0.37) % 1;

          const flash = clamp(1 - phase / 0.1, 0, 1);
          if (flash > 0.01) {
            ctx.fillStyle = `rgba(196, 247, 255, ${flash * 0.5})`;
            ctx.beginPath();
            ctx.arc(hx, hy, 1.4 + flash * 1.5, 0, TAU);
            ctx.fill();
          }

          if (phase > 0.07 && phase < 0.6) {
            const k = (phase - 0.07) / 0.53;
            const radius = 1.3 + k * 9;
            const alpha = (1 - k) * (1 - k) * 0.42;
            ctx.strokeStyle = `rgba(216, 250, 255, ${alpha})`;
            ctx.lineWidth = 0.75 * (1 - k * 0.5);
            ctx.beginPath();
            ctx.ellipse(hx, hy, radius, radius * 0.4, -0.2, 0, TAU);
            ctx.stroke();
          }

          if (phase > 0.15 && phase < 0.76) {
            const k = (phase - 0.15) / 0.61;
            const side = hit % 2 ? 1 : -1;
            ctx.fillStyle = `rgba(255, 228, 241, ${(1 - k) * 0.44})`;
            ctx.beginPath();
            ctx.arc(
              hx + side * (2.5 + k * 12),
              hy + k * 6 + Math.sin(k * Math.PI) * 1.3,
              0.85,
              0,
              TAU
            );
            ctx.fill();
          }
        }
        ctx.restore();

        ctx.globalAlpha = 0.82;
        ctx.strokeStyle = "rgba(255, 190, 220, .72)";
        ctx.lineWidth = 1.2;
        ctx.shadowColor = "rgba(255, 72, 170, .8)";
        ctx.shadowBlur = 18;
        ctx.stroke(canopy);
        ctx.shadowBlur = 0;

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "lighter";
        for (let drip = 0; drip < 7; drip++) {
          const t = 0.08 + drip * 0.145;
          const x =
            (1 - t) * (1 - t) * 614 +
            2 * (1 - t) * t * 680 +
            t * t * 748;
          const edgeY =
            (1 - t) * (1 - t) * 521 +
            2 * (1 - t) * t * 470 +
            t * t * 525;
          const phase = (time * (0.54 + drip * 0.035) + drip * 0.137) % 1;
          const fall = smoothstep(0.48, 1, phase);
          const y = edgeY + 2 + fall * (18 + drip * 5);
          ctx.globalAlpha = (1 - fall) * (0.12 + (drip % 3) * 0.045);
          ctx.strokeStyle =
            drip % 2 ? "rgba(119, 235, 251, .85)" : "rgba(255, 155, 207, .82)";
          ctx.lineWidth = 0.65;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 0.4, y + 4 + (drip % 2) * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawContact(time, hand, intensity, fish) {
        const nose = fishNose(fish.state);
        const baseX = (hand.x + nose.x) / 2;
        const baseY = (hand.y + nose.y) / 2;
        const pulsePhase = (time + 0.7) % 4.2;
        const pulse = pulsePhase < 0.58 ? Math.sin((pulsePhase / 0.58) * Math.PI) : 0;
        const level = intensity * 0.78 + pulse * 0.22;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        drawGlowSprite(glowHotPink, baseX, baseY, 130 + level * 120, 104 + level * 90, 0.18 + level * 0.34);
        drawGlowSprite(glowCyan, baseX - 12, baseY + 7, 66, 55, 0.06 + level * 0.08);

        for (let strand = 0; strand < 7; strand++) {
          const offset = (strand - 3) * 4.8;
          const wave = Math.sin(time * 2.8 + strand * 1.12) * (5 + strand);
          ctx.strokeStyle = strand % 2
            ? `rgba(255, 151, 213, ${0.09 + level * 0.17})`
            : `rgba(255, 57, 159, ${0.1 + level * 0.2})`;
          ctx.lineWidth = strand === 3 ? 1.2 : 0.7;
          ctx.beginPath();
          ctx.moveTo(nose.x, nose.y - 1 + offset * 0.16);
          ctx.bezierCurveTo(
            nose.x + 12,
            nose.y + 15 + wave,
            hand.x - 14,
            hand.y - 18 - wave,
            hand.x,
            hand.y
          );
          ctx.stroke();
        }

        for (let ring = 0; ring < 3; ring++) {
          const phase = ((time * 0.32 + ring * 0.33 + fish.index * 0.08) % 1);
          const radius = 14 + phase * 76;
          ctx.globalAlpha = (1 - phase) * (0.14 + level * 0.22);
          ctx.strokeStyle = ring % 2 ? "rgba(255, 149, 211, .8)" : "rgba(103, 241, 255, .6)";
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.ellipse(baseX, baseY, radius, radius * 0.38, -0.16, 0, TAU);
          ctx.stroke();
        }

        const sparkCount = 15;
        for (let index = 0; index < sparkCount; index++) {
          const angle = index * 2.399 + Math.sin(time * 0.8 + index) * 0.15;
          const distance = 8 + ((time * 18 + index * 16) % 72);
          const alpha = (1 - distance / 88) * (0.18 + level * 0.42);
          const sx = baseX + Math.cos(angle) * distance * 1.32;
          const sy = baseY + Math.sin(angle) * distance * 0.58 - distance * 0.12;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = index % 3 ? "rgba(255, 137, 204, .9)" : "rgba(203, 251, 255, .85)";
          const size = index % 4 === 0 ? 1.7 : 0.9;
          ctx.fillRect(sx, sy, size, size);
        }

        if (energy > 0.02) {
          const burst = 1 - energy;
          for (let ring = 0; ring < 4; ring++) {
            const radius = 10 + burst * (56 + ring * 38);
            ctx.globalAlpha = energy * (0.3 - ring * 0.05);
            ctx.strokeStyle = ring % 2 ? "rgba(255, 113, 192, .9)" : "rgba(116, 242, 255, .8)";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(baseX, baseY, radius, radius * 0.48, 0, 0, TAU);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function drawSelectedFishMarker(time) {
        if (selectedFish < 0) return;
        const fish = fishSchool[selectedFish];
        if (fish.entryFade < 0.4) return;
        const pulse = 0.7 + Math.sin(time * 2.7) * 0.2;
        ctx.save();
        ctx.globalAlpha = 0.42;
        ctx.strokeStyle = "rgba(255, 148, 207, .55)";
        ctx.setLineDash([2, 8]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(fish.state.x - 34 * fish.state.scale, fish.state.y, 430 * fish.state.scale, 191 * fish.state.scale, fish.state.rot, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        drawGlowSprite(glowHotPink, fish.state.x - 405 * fish.state.scale, fish.state.y + 78 * fish.state.scale, 36, 36, 0.08 * pulse);
      }

      const rainRandom = mulberry32(719);
      const rainDrops = Array.from({ length: reducedMotion ? 280 : 640 }, (_, index) => {
        const depth = rainRandom() > 0.82 ? randomRange(rainRandom, 0.75, 1) : randomRange(rainRandom, 0.18, 0.76);
        return {
          x: randomRange(rainRandom, -80, W + 160),
          y: randomRange(rainRandom, -200, H + 100),
          depth,
          length: randomRange(rainRandom, 10, 34) * (0.5 + depth),
          speed: randomRange(rainRandom, 420, 820) * (0.5 + depth),
          phase: rainRandom() * 100,
          index
        };
      });

      function drawRain(time) {
        const wind = 0.14 + pointer.sx * 0.014;
        ctx.save();
        ctx.lineCap = "round";

        for (const drop of rainDrops) {
          const spanY = H + 300;
          const spanX = W + 320;
          const y = ((drop.y + time * drop.speed) % spanY) - 110;
          const x = ((drop.x - time * drop.speed * wind + 10000) % spanX) - 100;
          const near = drop.depth > 0.74;
          const far = drop.depth < 0.42;
          const sway = 0.85 + Math.sin(time * 0.6 + drop.phase) * 0.08;
          const length = drop.length * sway * (near ? 1.7 : far ? 0.72 : 1);

          // Rain is only coloured where light actually reaches it: the LED
          // wall, the data placard, and the warm key standing behind her.
          const inBand = y > 20 && y < 690 ? 1 : 0;
          const wall = clamp(1 - Math.abs(x - 741) / 310, 0, 1) * inBand;
          const placard = clamp(1 - Math.abs(x - 1038) / 150, 0, 1) * inBand;
          const warm = clamp(1 - Math.abs(x - 794) / 130, 0, 1) * inBand * (y > 430 ? 1 : 0.35);
          const lit = Math.max(wall, placard, warm);

          let rgb;
          if (warm > 0.08 && warm >= Math.max(wall, placard)) {
            rgb = "255, 186, 122";
          } else if (lit > 0.08) {
            rgb = (drop.index + Math.floor(y / 48)) % 3
              ? "255, 151, 207"
              : "142, 235, 249";
          } else {
            rgb = near ? "203, 236, 248" : far ? "104, 148, 178" : "127, 184, 213";
          }

          if (near) {
            // A bright head with a tail that has already lost its light — that
            // gradient is what makes a streak read as motion rather than wire.
            const head = length * 0.22;
            ctx.strokeStyle = `rgba(${rgb}, 0.085)`;
            ctx.lineWidth = 2.7;
            ctx.beginPath();
            ctx.moveTo(x - length * wind, y + length);
            ctx.lineTo(x - head * wind, y + head);
            ctx.stroke();
            ctx.strokeStyle = `rgba(${rgb}, ${Math.min(0.5, 0.22 + lit * 0.22)})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - head * wind, y + head);
            ctx.lineTo(x, y);
            ctx.stroke();
          } else {
            const alpha = far ? 0.024 + drop.depth * 0.08 : 0.07 + drop.depth * 0.16;
            ctx.strokeStyle = `rgba(${rgb}, ${Math.min(0.4, alpha + lit * 0.07)})`;
            ctx.lineWidth = far ? 0.45 : 0.6 + drop.depth * 0.85;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - length * wind, y + length);
            ctx.stroke();
          }
        }

        for (let index = 0; index < 30; index++) {
          const x = (index * 97 + 31) % W;
          const y = ((index * 83 + time * 610) % (H + 180)) - 80;
          ctx.strokeStyle = `rgba(190, 227, 242, ${0.02 + (index % 4) * 0.012})`;
          ctx.lineWidth = 2 + (index % 3);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 8, y + 84 + (index % 5) * 12);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawAtmosphere(time) {
        const mist = ctx.createLinearGradient(0, 612, 0, 748);
        mist.addColorStop(0, "rgba(22, 28, 49, 0)");
        mist.addColorStop(0.55, "rgba(33, 35, 59, .08)");
        mist.addColorStop(1, "rgba(9, 12, 22, .02)");
        ctx.fillStyle = mist;
        ctx.fillRect(0, 608, W, 144);

        drawGlowSprite(glowPink, 1010, 675, 950, 180, 0.06);
        drawGlowSprite(glowCyan, 535, 694, 710, 135, 0.04);

        const bloom = ctx.createLinearGradient(0, 690, 0, 900);
        bloom.addColorStop(0, "rgba(255, 54, 146, .018)");
        bloom.addColorStop(0.55, "rgba(255, 53, 142, .006)");
        bloom.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = bloom;
        ctx.fillRect(0, 690, W, 210);
      }

      function drawFilmGrain(time) {
        if (!noisePattern) return;
        ctx.save();
        ctx.globalCompositeOperation = "soft-light";
        ctx.globalAlpha = isStill ? 0.065 : 0.045 + Math.sin(time * 9.1) * 0.009;
        const shiftX = Math.floor(Math.sin(time * 0.7) * 80);
        const shiftY = Math.floor(Math.cos(time * 0.61) * 55);
        ctx.translate(shiftX, shiftY);
        ctx.fillStyle = noisePattern;
        ctx.fillRect(-shiftX - 100, -shiftY - 100, W + 200, H + 200);
        ctx.restore();
      }

      function drawSceneBloom() {
        if (!bloomPen || bloomCanvas.width < 2) return;
        bloomPen.setTransform(1, 0, 0, 1, 0, 0);
        bloomPen.filter = "blur(3.4px) saturate(1.15)";
        bloomPen.drawImage(canvas, 0, 0, bloomCanvas.width, bloomCanvas.height);
        bloomPen.filter = "none";
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.2;
        ctx.drawImage(bloomCanvas, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function drawDevelopPass(time) {
        if (introDone) return;
        if (time >= INTRO_END) {
          introDone = true;
          return;
        }

        const cw = canvas.width;
        const ch = canvas.height;
        const reveal = introReveal(time);
        const veil = 1 - reveal;

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = veil;
        ctx.fillStyle = INTRO_BLACK;
        ctx.fillRect(0, 0, cw, ch);

        const glow = introGlow(time);
        if (glow > 0.003 && bloomCanvas.width > 1) {
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = glow;
          ctx.drawImage(bloomCanvas, 0, 0, cw, ch);
        }

        // Rain gets its own beat: while the city is still dark the streaks are
        // drawn a second time, on top, so they read before anything else. It
        // decays away as the real frame takes over the exposure.
        const rainPass =
          introRamp(time, INTRO_RAIN_IN, INTRO_RAIN_FULL) * (1 - reveal * 0.55);
        if (rainPass > 0.004) {
          const camera = cameraTransform(time);
          ctx.setTransform(
            dpr * viewScale,
            0,
            0,
            dpr * viewScale,
            dpr * viewOffsetX,
            dpr * viewOffsetY
          );
          ctx.save();
          ctx.translate(W / 2 + camera.x, H / 2 + camera.y);
          ctx.scale(camera.scale, camera.scale);
          ctx.translate(-W / 2, -H / 2);
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = rainPass;
          drawRain(time);
          ctx.restore();
        }

        ctx.restore();
      }

      function render(time) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#03050b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        applySceneTransform();

        ctx.save();
        const camera = cameraTransform(time);
        const pointerScale = 1 + pointer.sy * 0.0014;
        ctx.translate(W / 2 + camera.x, H / 2 + camera.y);
        ctx.scale(camera.scale * pointerScale, camera.scale * pointerScale);
        ctx.translate(-W / 2, -H / 2);

        drawSky(time);
        drawSearchLights(time);
        drawCityLayers(time);
        drawPixelBillboard(time);
        drawCityDepthAtmosphere(time);
        drawFloatingHolo(time);
        drawSkyInfrastructure(time);
        drawDistantTraffic(time);
        drawMaglev(time);
        drawSkyTraffic(time);
        drawSkyCruiser(time);
        drawSteam(time);
        drawAirMotes(time);
        drawDrone(time, 1150 + Math.sin(time * 0.035) * 210, 126 + Math.sin(time * 0.21) * 8, 0.4);
        drawDrone(time, 184 + Math.sin(time * 0.024 + 2) * 145, 573 + Math.sin(time * 0.18 + 2) * 4, 2.1);
        drawSelectedFishMarker(time);
        drawUnderBridge(time);
        drawFishLayer(time);
        drawBridgeBack(time);
        drawBridgeDeck(time);
        drawBridgeLighting(time);
        drawStreetGrime(time);
        drawContactShadows(time);
        drawDeckRainImpacts(time);
        drawStreetReflections(time);
        drawHoloReflection(time);
        drawSpinnerVehicle(time);
        drawPinkAtmosphere(time);

        const ambientFish = fishSchool[0];
        const interactionFish = selectedFish >= 0 ? fishSchool[selectedFish] : ambientFish;
        const ambientNose = fishNose(ambientFish.state);
        const ambientHand = { x: 776, y: 544 };
        const selectedNose = selectedFish >= 0 ? fishNose(interactionFish.state) : ambientNose;
        const selectedDistance = Math.hypot(selectedNose.x - ambientHand.x, selectedNose.y - ambientHand.y);
        const selectedProximity = clamp(1 - selectedDistance / 220, 0, 1);
        const contactIntensity = selectedFish >= 0
          ? clamp(interactionFish.arrival * (0.62 + Math.sin(time * 1.3) * 0.12) + energy * 0.35, 0, 1.4) * selectedProximity
          : 0;
        const fishApproachRaise =
          selectedFish >= 0 ? smoothstep(620, 210, selectedDistance) : 0;
        const nearestUnclickedDistance =
          selectedFish >= 0
            ? Infinity
            : Math.min(
                ...fishSchool.map((fish) => {
                  const nose = fishNose(fish.state);
                  return Math.hypot(nose.x - ambientHand.x, nose.y - ambientHand.y);
                })
              );
        const idleRaiseGate =
          selectedFish >= 0 ? 0 : smoothstep(260, 420, nearestUnclickedDistance);
        // No cursor, no reticle, no tooltip: when a fish drifts close she
        // simply answers it. The gesture is the affordance — it breathes on a
        // slow cycle so it reads as an invitation rather than a twitch.
        const beckonGate = 0.5 + 0.5 * Math.sin(time * 0.34);
        const beckon =
          selectedFish >= 0
            ? 0
            : smoothstep(320, 150, nearestUnclickedDistance) * (0.22 + 0.78 * beckonGate);
        const armRaise = Math.max(
          idleHandRaise(time) * idleRaiseGate,
          beckon * 0.46,
          fishApproachRaise
        );
        currentArmRaise = armRaise;
        const hand = drawWomanBack(time, Math.max(contactIntensity, beckon * 0.42), armRaise);
        if (contactIntensity > 0.012) {
          drawContact(time, hand, contactIntensity, interactionFish);
        }

        drawAtmosphere(time);
        drawRain(time);
        drawLensDrops(time);
        drawForegroundCables(time);
        drawFilmGrain(time);
        ctx.restore();

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        drawSceneBloom();
        drawDevelopPass(Number.isFinite(fixedIntro) ? fixedIntro : time);
      }

      function screenToFish(clientX, clientY) {
        const point = toScene(clientX, clientY);
        let result = -1;
        let bestScore = Infinity;

        for (const fish of fishSchool) {
          const dx = point.x - fish.state.x;
          const dy = point.y - fish.state.y;
          const cos = Math.cos(-fish.state.rot);
          const sin = Math.sin(-fish.state.rot);
          const localX = (dx * cos - dy * sin) / fish.state.scale;
          const localY = (dx * sin + dy * cos) / fish.state.scale;
          const tailIncluded = localX >= 235 && localX <= 670 && localY > -245 && localY < 235;
          const insideBody = Math.pow((localX + 80) / 340, 2) + Math.pow(localY / 168, 2) < 1;
          if (!insideBody && !tailIncluded) continue;
          const score = Math.hypot(localX + 80, localY) * fish.state.scale;
          if (score < bestScore) {
            bestScore = score;
            result = fish.index;
          }
        }
        return result;
      }

      function updatePointerFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        const clientX = event.clientX - rect.left;
        const clientY = event.clientY - rect.top;
        pointer.x = clientX;
        pointer.y = clientY;
        pointer.nx = (clientX / Math.max(1, rect.width)) * 2 - 1;
        pointer.ny = (clientY / Math.max(1, rect.height)) * 2 - 1;
        pointer.inside = true;
        pointer.fishIndex = screenToFish(clientX, clientY);
        pointer.hovering = pointer.fishIndex >= 0;
        canvas.classList.toggle("is-hovering", pointer.hovering);
      }

      function selectFish(index) {
        if (index < 0 || index >= fishSchool.length) return;
        const previous = selectedFish;
        const fish = fishSchool[index];
        selectedFish = index;
        lastUserActionAt = elapsed;
        fish.arrival = 0;
        fish.trail.length = 0;

        // The hero fish may only enter the interaction from the right. If the
        // clicked fish is already left of the raised hand, its hologram
        // re-forms just beyond the hand and keeps swimming left from there.
        const anchor = heroAnchorForLayout();
        if (fish.state.x < anchor.x) {
          fish.state.x = anchor.x + 520 * anchor.scale;
          fish.entryFade = 0;
        } else {
          fish.entryFade = 1;
        }

        energy = Math.max(energy, 0.8);
        queueMemory();

        if (previous >= 0 && previous !== index) {
          const released = fishSchool[previous];
          alignLanePhaseToCurrentState(released, elapsed);
          released.arrival = 0;
        }
      }

      function triggerPulse() {
        energy = 1;
        lastUserActionAt = elapsed;
        if (selectedFish >= 0) {
          const fish = fishSchool[selectedFish];
          fish.trail.push({
            x: fish.state.x,
            y: fish.state.y,
            rot: fish.state.rot,
            scale: fish.state.scale,
            age: 0
          });
          if (pendingMemoryIndex >= 0) revealMemory();
        }
      }

      function handlePointerMove(event) {
        updatePointerFromEvent(event);
      }

      function handlePointerLeave() {
        pointer.hovering = false;
        pointer.inside = false;
        pointer.fishIndex = -1;
        canvas.classList.remove("is-hovering");
      }

      function handlePointerDown(event) {
        skipIntro();
        ensureAmbientAudio();
        updatePointerFromEvent(event);
        const index = pointer.fishIndex;
        if (index >= 0) {
          selectFish(index);
        } else if (selectedFish >= 0) {
          hideMemory();
          energy = Math.max(energy, 0.85);
          lastUserActionAt = elapsed;
        } else {
          triggerPulse();
        }
      }

      function handleKeyDown(event) {
        if (event.code === "Escape") {
          skipIntro();
        } else if (event.code === "Space") {
          event.preventDefault();
          ensureAmbientAudio();
          triggerPulse();
        } else if (event.key.toLowerCase() === "p") {
          paused = !paused;
          lastFrame = performance.now();
        } else if (event.key.toLowerCase() === "f") {
          if (document.fullscreenElement) {
            document.exitFullscreen?.();
          } else {
            document.documentElement.requestFullscreen?.();
          }
        }
      }

      function positionMemory() {
        if (!memoryShown || selectedFish < 0) return;
        const fish = fishSchool[selectedFish];
        const stageRect = stage.getBoundingClientRect();
        const fishBodyWidth = 660 * fish.state.scale * viewScale;
        // The panel used to claim two thirds of the artwork while its type was
        // pinned at the clamp ceiling — it read as a burnt-in subtitle rather
        // than something surfacing out of the scene. Narrower measure, smaller
        // type, and both scale together so the block keeps its proportions.
        const width = clamp(Math.min(480, fishBodyWidth * 1.18, stageRect.width * 0.54), 88, 480);
        // Type was a notch too small to read at a glance, so the ratio and both
        // ends of the clamp went up by 20%. The panel keeps the same
        // proportions, it is just set one size larger.
        const fontSize = clamp(width * 0.0432, 8.9, 11.5);
        memoryPanel.style.width = `${width.toFixed(1)}px`;
        memoryPanel.style.fontSize = `${fontSize.toFixed(1)}px`;
        const height = memoryPanel.offsetHeight || 140;
        const margin = 16;
        const driftX = Math.sin(elapsed * 0.32) * 3;
        const driftY = Math.cos(elapsed * 0.27) * 2;
        const bodyCenterX = fish.state.x - 82 * fish.state.scale;
        const bodyCenterY = fish.state.y - 2 * fish.state.scale;
        const camera = cameraTransform(elapsed);
        const cameraX =
          W / 2 + camera.x + (bodyCenterX - W / 2) * camera.scale;
        const cameraY =
          H / 2 + camera.y + (bodyCenterY - H / 2) * camera.scale;
        let x = viewOffsetX + cameraX * viewScale + driftX;
        let y = viewOffsetY + cameraY * viewScale + driftY;
        x = clamp(x, margin + width / 2, stageRect.width - margin - width / 2);
        y = clamp(y, margin + height / 2, stageRect.height - margin - height / 2);
        memoryPanel.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      }

      window.__neonTide = {
        version: 39,
        bodyProfile: () => {
          const probe = document.createElement("canvas");
          probe.width = 700;
          probe.height = 400;
          const pen = probe.getContext("2d");
          pen.translate(420, 200);
          bodyPath(pen);
          pen.fillStyle = "#ffffff";
          pen.fill();
          const image = pen.getImageData(0, 0, probe.width, probe.height);
          let topPeak = { x: 0, y: 0 };
          let bottomPeak = { x: 0, y: 0 };
          for (let x = -414; x <= 258; x += 3) {
            let top = null;
            let bottom = null;
            for (let y = -190; y <= 175; y++) {
              const pixelX = 420 + x;
              const pixelY = 200 + y;
              if (image.data[(pixelY * probe.width + pixelX) * 4 + 3] > 0) {
                top = y;
                break;
              }
            }
            for (let y = 175; y >= -190; y--) {
              const pixelX = 420 + x;
              const pixelY = 200 + y;
              if (image.data[(pixelY * probe.width + pixelX) * 4 + 3] > 0) {
                bottom = y;
                break;
              }
            }
            if (top !== null && (topPeak.y === 0 || top < topPeak.y)) topPeak = { x, y: top };
            if (bottom !== null && (bottomPeak.y === 0 || bottom > bottomPeak.y)) bottomPeak = { x, y: bottom };
          }
          return { topPeak, bottomPeak };
        },
        snapshot: () =>
          fishSchool.map((fish) => ({
            index: fish.index,
            x: Number(fish.state.x.toFixed(2)),
            y: Number(fish.state.y.toFixed(2)),
            scale: Number(fish.state.scale.toFixed(3)),
            rot: Number(fish.state.rot.toFixed(3)),
            direction: fish.direction,
            speed: fish.speed,
            entryFade: Number(fish.entryFade.toFixed(3)),
            hologramAlpha: Number(fishHologramFlicker(fish, elapsed).toFixed(3)),
            selected: fish.index === selectedFish
          })),
        selectFish: (index) => selectFish(index),
        previewCapture: {
          pause() {
            paused = true;
            lastFrame = performance.now();
          },
          step(seconds = 0.1) {
            const delta = clamp(seconds, 0.001, 0.25);
            elapsed += delta;
            updateFish(delta, elapsed);
            render(elapsed);
            positionMemory();
          }
        },
        state: () => ({
          portraitMode,
          viewScale,
          viewOffsetX,
          viewOffsetY,
          stageWidth: stage.clientWidth,
          stageHeight: stage.clientHeight,
          armRaise: Number(currentArmRaise.toFixed(3)),
          idleArmRaise: Number(idleHandRaise(elapsed).toFixed(3)),
          cameraScale: Number(cameraTransform(elapsed).scale.toFixed(6)),
          audioEnabled,
          audioState: audioContext ? audioContext.state : "off",
          fishRenderer: fish3D ? "webgl" : "canvas2d",
          fishResolution: fish3D
            ? `${fish3D.canvas.width}x${fish3D.canvas.height}`
            : `${W}x${H}`,
          pixelBillboardReady: Boolean(pixelBillboard),
          billboardParallax: {
            x: Number((-pointer.sx * 9).toFixed(2)),
            y: Number((pointer.sy * 3).toFixed(2))
          },
          selectedFish,
          memoryShown,
          memoryVisibleClass: memoryPanel.classList.contains("is-visible"),
          memoryWidth: memoryPanel.style.width,
          memoryFontSize: memoryPanel.style.fontSize
        })
      };

      function animate(now) {
        const delta = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
        lastFrame = now;
        if (!paused) {
          elapsed += delta;
          updateFish(delta, elapsed);
          pointer.sx = lerp(pointer.sx, pointer.nx, 1 - Math.exp(-delta * 4.6));
          pointer.sy = lerp(pointer.sy, pointer.ny, 1 - Math.exp(-delta * 4.6));
        }
        render(elapsed);
        positionMemory();
        if (!isStill) requestAnimationFrame(animate);
      }

      resize();
      if (isStill) {
        for (let settle = 0; settle < 160; settle++) {
          updateFish(1 / 60, elapsed);
        }
      } else {
        updateFish(0.016, elapsed);
      }
      render(elapsed);

      if (!isStill) {
        window.addEventListener("resize", resize);
        canvas.addEventListener("pointermove", handlePointerMove, { passive: true });
        canvas.addEventListener("pointerleave", handlePointerLeave, { passive: true });
        canvas.addEventListener("pointerdown", handlePointerDown);
        window.addEventListener("keydown", handleKeyDown);
        document.addEventListener("visibilitychange", () => {
          lastFrame = performance.now();
          if (audioContext && audioContext.state !== "closed") {
            if (document.hidden) {
              audioContext.suspend().catch(() => {});
            } else if (audioEnabled) {
              audioContext.resume().catch(() => {});
            }
          }
        });
        requestAnimationFrame(animate);
      } else {
        drawSelectedFishMarker(elapsed);
      }
    })();
  </script>
</body>
</html>
