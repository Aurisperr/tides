      function drawPixelBillboard(time) {
        if (!pixelBillboard) return;
        const grid = pixelBillboard.grid;
        const width = 420;
        const height = 420;
        // The billboard intentionally bleeds off the left edge of the final
        // composition; roughly one tenth of the physical frame stays outside.
        const x = 520;
        const y = 54;
        const cell = width / grid;
        const frame = Math.floor(time * 18);
        // ① Backlight breathing. The portrait's own exposure barely moves — it
        // is the lamps behind the panel that do the work, with a mains wobble
        // layered on top so the cycle never lands twice the same way.
        const breathSlow = 0.5 + 0.5 * Math.sin(time * 1.42);
        const breathWobble = Math.sin(time * 9.7) * 0.035 + Math.sin(time * 23.3) * 0.02;
        const backlight = 0.5 + breathSlow * 0.82 + breathWobble;
        const breathe = 0.84 + Math.sin(time * 0.83) * 0.022;
        const parallaxX = -pointer.sx * 9;
        const parallaxY = pointer.sy * 3;

        ctx.save();
        ctx.translate(parallaxX, parallaxY);

        const mountTop = y + height + 12;
        const mountBottom = 706;
        const mountLeft = x + 34;
        const mountRight = x + width - 8;
        const mount = ctx.createLinearGradient(0, mountTop, 0, mountBottom);
        mount.addColorStop(0, "rgba(8, 15, 27, .98)");
        mount.addColorStop(0.5, "rgba(4, 9, 18, .97)");
        mount.addColorStop(1, "rgba(1, 4, 10, .96)");
        ctx.fillStyle = mount;
        ctx.beginPath();
        ctx.moveTo(mountLeft + 18, mountTop);
        ctx.lineTo(mountRight, mountTop);
        ctx.lineTo(mountRight + 28, mountBottom);
        ctx.lineTo(mountLeft - 30, mountBottom);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(67, 113, 138, .12)";
        ctx.lineWidth = 1;
        for (let rib = 0; rib < 5; rib++) {
          const topX = mountLeft + 54 + rib * 66;
          const bottomX = topX - 12 + rib * 9;
          ctx.beginPath();
          ctx.moveTo(topX, mountTop + 4);
          ctx.lineTo(bottomX, mountBottom);
          ctx.stroke();
        }
        for (let seam = 0; seam < 3; seam++) {
          const seamY = mountTop + 54 + seam * 58;
          ctx.strokeStyle = `rgba(71, 101, 125, ${0.1 - seam * 0.018})`;
          ctx.beginPath();
          ctx.moveTo(mountLeft - seam * 8, seamY);
          ctx.lineTo(mountRight + seam * 10, seamY);
          ctx.stroke();
        }

        ctx.globalCompositeOperation = "screen";
        const mountSpill = ctx.createLinearGradient(0, mountTop, 0, mountTop + 180);
        mountSpill.addColorStop(0, `rgba(255, 92, 181, ${0.09 * backlight})`);
        mountSpill.addColorStop(0.34, `rgba(111, 211, 240, ${0.04 * backlight})`);
        mountSpill.addColorStop(1, "rgba(5, 12, 22, 0)");
        ctx.fillStyle = mountSpill;
        ctx.fillRect(mountLeft - 24, mountTop, mountRight - mountLeft + 66, 180);
        ctx.globalCompositeOperation = "source-over";

        drawGlowSprite(
          glowCyan,
          x + width * 0.48,
          y + height * 0.5,
          width * 1.12,
          height * 1.08,
          0.042 * backlight
        );
        drawGlowSprite(
          glowHotPink,
          x + width * 0.7,
          y + height * 0.53,
          width * 0.84,
          height * 0.72,
          0.027 * backlight
        );
        drawGlowSprite(
          glowHotPink,
          x + width * 0.5,
          y + height + 76,
          width * 0.88,
          210,
          0.026 * backlight
        );

        // ── The cabinet, in planes ────────────────────────────────────────
        // This used to be one hard black square with a bright rim, which is
        // why it read as a decal laid over the city. A real sign box is five
        // stacked planes: the shadow it drops on the mount, the outer shell,
        // the chamfer that catches the skyline, the recessed lip the glass
        // sits behind, and the vent strip underneath.

        // ① Contact shadow, offset down-right because the panel is lit from
        // above and by the lamps behind it.
        ctx.fillStyle = "rgba(0, 2, 6, .5)";
        ctx.beginPath();
        ctx.roundRect(x + 7, y + 13, width + 20, height + 20, 6);
        ctx.fill();

        // ② Outer shell, top-lit: lighter along the upper edge, sinking to
        // near-black at the bottom so the box turns away from the street.
        const shell = ctx.createLinearGradient(x, y - 12, x + width, y + height + 12);
        shell.addColorStop(0, "rgba(17, 29, 45, .97)");
        shell.addColorStop(0.46, "rgba(7, 13, 23, .97)");
        shell.addColorStop(1, "rgba(2, 4, 10, .98)");
        ctx.fillStyle = shell;
        ctx.beginPath();
        ctx.roundRect(x - 10, y - 10, width + 20, height + 20, 3);
        ctx.fill();

        // ③ Chamfer: a one-pixel lit line along the top-left and a heavier
        // shadow down the bottom-right. This single detail is the whole
        // difference between a plate and a box.
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(126, 190, 218, .16)";
        ctx.beginPath();
        ctx.moveTo(x - 9.5, y + height + 8.5);
        ctx.lineTo(x - 9.5, y - 9.5);
        ctx.lineTo(x + width + 8.5, y - 9.5);
        ctx.stroke();
        ctx.strokeStyle = "rgba(0, 2, 6, .8)";
        ctx.beginPath();
        ctx.moveTo(x - 10, y + height + 9.5);
        ctx.lineTo(x + width + 9.5, y + height + 9.5);
        ctx.lineTo(x + width + 9.5, y - 10);
        ctx.stroke();

        // The old rim, kept but quietened. It used to be the brightest edge on
        // the frame; now it is a hint that the glass is sealed.
        ctx.strokeStyle = "rgba(86, 229, 247, .1)";
        ctx.strokeRect(x - 9.5, y - 9.5, width + 19, height + 19);

        // Bolts on the visible corners of the shell, none on the side panel —
        // the box has to be fastened somewhere and nobody fastens the face of a
        // sign you can already see the edge of.
        for (const [bx, by] of [
          [x - 4.5, y - 4.5],
          [x + width + 4.5, y - 4.5],
          [x - 4.5, y + height + 4.5],
          [x + width + 4.5, y + height + 4.5]
        ]) {
          ctx.fillStyle = "rgba(2, 5, 11, .9)";
          ctx.beginPath();
          ctx.arc(bx, by, 2.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(146, 196, 216, .16)";
          ctx.beginPath();
          ctx.arc(bx - 0.5, by - 0.6, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }

        const casing = ctx.createLinearGradient(
          x + width + 8,
          y,
          x + width + 24,
          y + height
        );
        casing.addColorStop(0, "rgba(8, 16, 27, .99)");
        casing.addColorStop(1, "rgba(1, 3, 8, .995)");
        ctx.fillStyle = casing;
        ctx.beginPath();
        ctx.moveTo(x + width + 8, y + 8);
        ctx.lineTo(x + width + 24, y + 20);
        ctx.lineTo(x + width + 24, y + height + 18);
        ctx.lineTo(x + width + 8, y + height + 8);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        const casingLight = ctx.createLinearGradient(
          x + width + 8,
          y,
          x + width + 24,
          y + height
        );
        casingLight.addColorStop(0, "rgba(102, 232, 248, .11)");
        casingLight.addColorStop(0.5, "rgba(194, 110, 226, .07)");
        casingLight.addColorStop(1, "rgba(255, 88, 177, .035)");
        ctx.fillStyle = casingLight;
        ctx.beginPath();
        ctx.moveTo(x + width + 8, y + 8);
        ctx.lineTo(x + width + 24, y + 20);
        ctx.lineTo(x + width + 24, y + height + 18);
        ctx.lineTo(x + width + 8, y + height + 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // ④ Vent strip. A separate box hanging off the bottom of the shell,
        // not a stripe painted on it — its own top shadow, its own lit lip,
        // its own vents, and it lets a little of the mount show through.
        ctx.fillStyle = "rgba(0, 2, 6, .55)";
        ctx.fillRect(x - 8, y + height + 12, width + 32, 18);
        const ventPlate = ctx.createLinearGradient(0, y + height + 8, 0, y + height + 26);
        ventPlate.addColorStop(0, "rgba(4, 8, 16, .97)");
        ventPlate.addColorStop(1, "rgba(1, 3, 9, .99)");
        ctx.fillStyle = ventPlate;
        ctx.fillRect(x - 12, y + height + 8, width + 36, 18);
        ctx.strokeStyle = "rgba(126, 190, 218, .13)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - 12, y + height + 8.5);
        ctx.lineTo(x + width + 24, y + height + 8.5);
        ctx.stroke();
        ctx.strokeStyle = "rgba(86, 226, 247, .12)";
        ctx.strokeRect(x - 11.5, y + height + 8.5, width + 35, 17);
        ctx.fillStyle = "rgba(255, 88, 177, .22)";
        for (let vent = 0; vent < 12; vent++) {
          ctx.fillRect(x + 22 + vent * 13, y + height + 15, 7, 1);
        }

        const maintenancePulse = 0.45 + Math.sin(time * 2.2) * 0.16;
        drawGlowSprite(glowCyan, x + 92, mountTop + 30, 26, 18, maintenancePulse * 0.18);
        drawGlowSprite(glowCyan, x + 278, mountTop + 30, 30, 18, maintenancePulse * 0.12);

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, 1);
        ctx.clip();
        ctx.fillStyle = "#02050a";
        ctx.fillRect(x, y, width, height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.globalAlpha = 0.18 * breathe;
        ctx.drawImage(pixelBillboard.wash, x, y, width, height);
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.72 * breathe;
        ctx.drawImage(pixelBillboard.sprite, x, y, width, height);
        ctx.globalCompositeOperation = "source-over";

        // Broken rows and a subdued panel wash keep the dot matrix reading as a
        // city-scale LED transmission rather than an ordinary image.
        for (let band = 0; band < 2; band++) {
          const sourceRow = (frame * 37 + band * 59) % Math.max(1, grid - 3);
          const shift = Math.sin(time * (1.7 + band * 0.6) + band) * (4 + band * 3);
          ctx.globalAlpha = 0.32;
          ctx.drawImage(
            pixelBillboard.sprite,
            0,
            sourceRow * pixelBillboard.spriteCell,
            pixelBillboard.sprite.width,
            pixelBillboard.spriteCell * 2,
            x + shift,
            y + sourceRow * cell,
            width,
            cell * 2
          );
        }

        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        const screenGrade = ctx.createLinearGradient(x, y, x + width, y + height);
        screenGrade.addColorStop(0, "rgba(8, 32, 52, .13)");
        screenGrade.addColorStop(0.5, "rgba(14, 15, 42, .09)");
        screenGrade.addColorStop(1, "rgba(42, 14, 44, .12)");
        ctx.fillStyle = screenGrade;
        ctx.fillRect(x, y, width, height);
        const glassShade = ctx.createLinearGradient(0, y, 0, y + height);
        glassShade.addColorStop(0, "rgba(1, 5, 14, .015)");
        glassShade.addColorStop(0.58, "rgba(1, 4, 12, .025)");
        glassShade.addColorStop(1, "rgba(1, 3, 10, .13)");
        ctx.fillStyle = glassShade;
        ctx.fillRect(x, y, width, height);
        ctx.fillStyle = "rgba(1, 3, 9, .055)";
        for (let lineY = y; lineY < y + height; lineY += 9) {
          ctx.fillRect(x, lineY, width, 1);
        }

        // Individual cells bloom like LEDs on an old modular display.
        ctx.globalCompositeOperation = "lighter";
        for (let lightIndex = 0; lightIndex < 24; lightIndex++) {
          const index =
            (frame * 131 + lightIndex * 1543 + lightIndex * lightIndex * 17) %
            pixelBillboard.lights.length;
          const light = pixelBillboard.lights[index];
          const blink =
            0.5 + 0.5 * Math.sin(time * 7.4 + lightIndex * 1.37 + light.row * 0.2);
          if (blink < 0.34) continue;
          const alpha = 0.035 + blink * 0.16;
          ctx.fillStyle = `rgba(${light.color[0]}, ${light.color[1]}, ${light.color[2]}, ${alpha})`;
          ctx.beginPath();
          ctx.arc(
            x + (light.column + 0.5) * cell,
            y + (light.row + 0.5) * cell,
            Math.max(0.8, cell * 0.3),
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        const scanY = y + ((time * 42) % height);
        const scan = ctx.createLinearGradient(x, scanY, x + width, scanY);
        scan.addColorStop(0, "rgba(83, 238, 255, 0)");
        scan.addColorStop(0.42, "rgba(105, 243, 255, .17)");
        scan.addColorStop(0.67, "rgba(255, 84, 177, .13)");
        scan.addColorStop(1, "rgba(255, 84, 177, 0)");
        ctx.globalAlpha = 0.5 + Math.sin(time * 1.3) * 0.08;
        ctx.fillStyle = scan;
        ctx.fillRect(x, scanY, width, 1.2);

        // ── Life on a wall this size ────────────────────────────────────────
        // Nothing below redraws the portrait. The artwork is left exactly as
        // authored; only the light behind it, the light falling on it, and the
        // signal carrying it are allowed to behave like a real LED feed.

        // ④ Signal loss. Rare, brief, and it tears in horizontal bands instead
        // of sliding the whole frame — which is how a bad feed actually fails.
        const glitchWindow = (((time + 4.3) % 11.7) / 11.7);
        if (glitchWindow < 0.055) {
          const burst = glitchWindow / 0.055;
          ctx.globalCompositeOperation = "screen";
          for (let slice = 0; slice < 4; slice++) {
            const row = (frame * 53 + slice * 71) % grid;
            const shift =
              (Math.sin(time * 61 + slice * 2.1) > 0 ? 1 : -1) * (2 + burst * 7);
            ctx.globalAlpha = 0.5 * burst;
            ctx.drawImage(
              pixelBillboard.sprite,
              0,
              row * pixelBillboard.spriteCell,
              pixelBillboard.sprite.width,
              pixelBillboard.spriteCell * 2,
              x + shift,
              y + row * cell,
              width,
              cell * 2
            );
          }
        }

        // ⑤ Channel drift. The colour planes lose sync for a frame or two, so
        // the portrait fringes instead of moving.
        const driftWindow = (((time + 11.1) % 19.4) / 19.4);
        if (driftWindow < 0.035) {
          const drift = driftWindow / 0.035;
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.26 * drift;
          ctx.drawImage(pixelBillboard.sprite, x - 1.6, y, width, height);
          ctx.globalAlpha = 0.2 * drift;
          ctx.drawImage(pixelBillboard.sprite, x + 1.6, y, width, height);
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = 0.16 * drift;
          ctx.fillStyle = "rgba(120, 240, 255, 1)";
          ctx.fillRect(x + width - 1.4, y, 1.4, height);
          ctx.globalAlpha = 0.1 * drift;
          ctx.fillStyle = "rgba(255, 90, 190, 1)";
          ctx.fillRect(x, y, 1.4, height);
        }

        // ③ Pixel crawl. A handful of cells misfire each beat, seeded off the
        // existing highlight table so the flicker stays on the bright shapes
        // where dead LEDs would actually cluster.
        ctx.globalCompositeOperation = "lighter";
        const crawlBeat = Math.floor(time * 11);
        for (let c = 0; c < 34; c++) {
          const index = (crawlBeat * 977 + c * 2477) % pixelBillboard.lights.length;
          const light = pixelBillboard.lights[index];
          const tick = (crawlBeat * 31 + c * 17) % 7;
          if (tick > 1) continue;
          ctx.globalAlpha = tick === 0 ? 0.14 : 0.06;
          ctx.fillStyle = `rgba(${light.color[0]}, ${light.color[1]}, ${light.color[2]}, 1)`;
          ctx.fillRect(
            x + light.column * cell,
            y + light.row * cell,
            cell * 0.62,
            cell * 0.62
          );
        }

        // ② Refresh sweep. One slow, broad band, barely there. This is the
        // single cheapest thing that makes a still image read as a panel being
        // re-read sixty times a second.
        const sweepY = y - 70 + (height + 140) * ((time % 4.9) / 4.9);
        const sweepBand = ctx.createLinearGradient(0, sweepY - 78, 0, sweepY + 78);
        sweepBand.addColorStop(0, "rgba(150, 235, 255, 0)");
        sweepBand.addColorStop(0.5, "rgba(178, 242, 255, .048)");
        sweepBand.addColorStop(1, "rgba(150, 235, 255, 0)");
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 1;
        ctx.fillStyle = sweepBand;
        ctx.fillRect(x, y, width, height);

        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.restore();

        // The seal around the glass, deliberately dim. A full-alpha rim on a
        // 420px square is the one thing in this frame that always reads as a
        // decal, so it drops to a hairline and gives most of its weight to the
        // corner brackets instead.
        ctx.strokeStyle = "rgba(94, 237, 253, .24)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 5.5, y - 5.5, width + 11, height + 11);
        ctx.strokeStyle = "rgba(0, 2, 8, .5)";
        ctx.strokeRect(x - 4.5, y - 4.5, width + 9, height + 9);
        ctx.strokeStyle = "rgba(255, 77, 173, .38)";
        ctx.lineWidth = 1.4;
        const bracket = 19;
        ctx.beginPath();
        ctx.moveTo(x - 8, y + bracket);
        ctx.lineTo(x - 8, y - 8);
        ctx.lineTo(x + bracket, y - 8);
        ctx.moveTo(x + width - bracket, y + height + 8);
        ctx.lineTo(x + width + 8, y + height + 8);
        ctx.lineTo(x + width + 8, y + height - bracket);
        ctx.stroke();

        // Two translucent strips of service text, just inside the seal.
        ctx.fillStyle = "rgba(110, 235, 249, .3)";
        ctx.fillRect(x + 8, y + 9, 61, 1);
        ctx.fillStyle = "rgba(110, 235, 249, .14)";
        ctx.fillRect(x + 8, y + 14, 27, 1);
        ctx.fillStyle = "rgba(255, 119, 186, .3)";
        ctx.fillRect(x + width - 68, y + height - 10, 60, 1);
        ctx.fillStyle = "rgba(255, 119, 186, .13)";
        ctx.fillRect(x + width - 34, y + height - 15, 26, 1);
        ctx.restore();
      }

      function drawSkyTraffic(time) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const traffic = [
          { y: 248, speed: 47, offset: 160, color: "255, 102, 174", scale: 1 },
          { y: 352, speed: 72, offset: 930, color: "89, 229, 249", scale: 0.72 },
          { y: 518, speed: 31, offset: 1400, color: "255, 155, 103", scale: 0.58 }
        ];
        for (let index = 0; index < traffic.length; index++) {
          const car = traffic[index];
          const x = -170 + ((time * car.speed + car.offset) % (W + 340));
          const y = car.y + Math.sin(time * 0.24 + index * 2.1) * 3;
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(car.scale, car.scale);
          ctx.globalAlpha = 0.26;
          const trail = ctx.createLinearGradient(-150, 0, 12, 0);
          trail.addColorStop(0, `rgba(${car.color}, 0)`);
          trail.addColorStop(1, `rgba(${car.color}, .52)`);
          ctx.strokeStyle = trail;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(-150, 1);
          ctx.lineTo(8, 1);
          ctx.stroke();
          ctx.globalAlpha = 0.78;
          ctx.fillStyle = "rgba(2, 5, 11, .9)";
          ctx.beginPath();
          ctx.ellipse(0, 0, 19, 4.6, -0.03, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = `rgba(${car.color}, .32)`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
          drawGlowSprite(
            index === 1 ? glowCyan : glowHotPink,
            14,
            0,
            39,
            18,
            0.32
          );
          ctx.restore();
        }
        ctx.restore();
      }

      function drawSkyCruiser(time) {
        const x = 792 + Math.sin(time * 0.028) * 185;
        const y = 101 + Math.sin(time * 0.16 + 1.1) * 4;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-0.035 + Math.sin(time * 0.09) * 0.012);

        drawGlowSprite(glowPink, 0, 3, 330, 132, 0.095);
        drawGlowSprite(glowViolet, 14, 18, 180, 64, 0.05);
        const hull = ctx.createLinearGradient(-118, -24, 112, 28);
        hull.addColorStop(0, "rgba(10, 15, 28, .94)");
        hull.addColorStop(0.45, "rgba(5, 9, 18, .98)");
        hull.addColorStop(1, "rgba(2, 5, 11, .99)");
        ctx.fillStyle = hull;
        ctx.beginPath();
        ctx.ellipse(0, 0, 122, 22, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(112, 234, 249, .2)";
        ctx.lineWidth = 0.8;
        ctx.stroke();

        ctx.fillStyle = "rgba(4, 8, 15, .96)";
        ctx.beginPath();
        ctx.moveTo(-78, -15);
        ctx.lineTo(-126, -36);
        ctx.lineTo(-111, 8);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(72, -14);
        ctx.lineTo(131, -29);
        ctx.lineTo(108, 10);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 98, 178, .19)";
        ctx.stroke();

        ctx.globalCompositeOperation = "lighter";
        const screen = ctx.createLinearGradient(-72, -11, 72, 12);
        screen.addColorStop(0, "rgba(255, 67, 165, .03)");
        screen.addColorStop(0.5, "rgba(255, 91, 178, .14)");
        screen.addColorStop(1, "rgba(86, 229, 249, .055)");
        ctx.fillStyle = screen;
        ctx.fillRect(-70, -10, 140, 20);
        ctx.globalAlpha = 0.36;
        ctx.strokeStyle = "rgba(255, 153, 207, .72)";
        ctx.lineWidth = 0.6;
        for (let index = 0; index < 6; index++) {
          const lineX = -61 + index * 24;
          ctx.beginPath();
          ctx.moveTo(lineX, -5);
          ctx.lineTo(lineX + 16, 5);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.7;
        for (let index = 0; index < 9; index++) {
          ctx.fillStyle = index % 3 === 0
            ? "rgba(255, 166, 104, .78)"
            : "rgba(108, 238, 252, .68)";
          ctx.fillRect(-99 + index * 21, 15, 5 + (index % 3) * 2, 1);
        }
        const searchlight = ctx.createLinearGradient(0, 20, 0, 154);
        searchlight.addColorStop(0, "rgba(255, 142, 190, .04)");
        searchlight.addColorStop(1, "rgba(255, 100, 181, 0)");
        ctx.fillStyle = searchlight;
        ctx.beginPath();
        ctx.moveTo(-15, 17);
        ctx.lineTo(16, 17);
        ctx.lineTo(68, 162);
        ctx.lineTo(-52, 162);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawSteam(time) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const vents = [
          { x: 265, y: 706, width: 130 },
          { x: 1036, y: 714, width: 170 },
          { x: 1398, y: 698, width: 110 }
        ];
        for (let ventIndex = 0; ventIndex < vents.length; ventIndex++) {
          const vent = vents[ventIndex];
          for (let puff = 0; puff < 6; puff++) {
            const phase = (time * 0.055 + puff * 0.157 + ventIndex * 0.23) % 1;
            const x = vent.x + Math.sin(time * 0.5 + puff * 2.1 + ventIndex) * (14 + phase * 40);
            const y = vent.y - phase * 132;
            drawGlowSprite(
              ventIndex === 1 ? glowViolet : glowCyan,
              x,
              y,
              vent.width * (0.4 + phase * 0.8),
              54 + phase * 70,
              (1 - phase) * (0.018 + ventIndex * 0.004)
            );
          }
        }
        ctx.restore();
      }

      function drawSkyInfrastructure(time) {
        ctx.save();
        const cables = [
          { x0: -70, y0: 98, cx: 380, cy: 212, x1: 1230, y1: 92, width: 1.8 },
          { x0: 990, y0: 28, cx: 1240, cy: 150, x1: 1670, y1: 246, width: 1.2 },
          { x0: 30, y0: 280, cx: 125, cy: 208, x1: 302, y1: 24, width: 1.4 }
        ];
        for (const cable of cables) {
          ctx.strokeStyle = "rgba(3, 7, 12, .82)";
          ctx.lineWidth = cable.width;
          ctx.beginPath();
          ctx.moveTo(cable.x0, cable.y0);
          ctx.quadraticCurveTo(cable.cx, cable.cy, cable.x1, cable.y1);
          ctx.stroke();
          ctx.strokeStyle = "rgba(93, 226, 247, .075)";
          ctx.lineWidth = 0.55;
          ctx.beginPath();
          ctx.moveTo(cable.x0, cable.y0 - 1);
          ctx.quadraticCurveTo(cable.cx, cable.cy - 1, cable.x1, cable.y1 - 1);
          ctx.stroke();
        }

        const cable = cables[0];
        for (let index = 0; index < 11; index++) {
          const at = 0.08 + index * 0.087;
          const x = (1 - at) * (1 - at) * cable.x0 + 2 * (1 - at) * at * cable.cx + at * at * cable.x1;
          const y = (1 - at) * (1 - at) * cable.y0 + 2 * (1 - at) * at * cable.cy + at * at * cable.y1;
          const blink = 0.2 + Math.max(0, Math.sin(time * 2.2 + index * 1.3)) * 0.55;
          drawGlowSprite(index % 3 ? glowPink : glowCyan, x, y + 4, 18, 18, blink * 0.2);
          ctx.fillStyle = index % 3 ? "rgba(255, 95, 177, .56)" : "rgba(88, 234, 255, .5)";
          ctx.fillRect(x, y + 3, 1.2, 3.2);
        }
        ctx.restore();
      }

      const airRandom = mulberry32(311);
      const airMotes = Array.from({ length: 72 }, () => ({
        x: randomRange(airRandom, -30, W + 30),
        y: randomRange(airRandom, 80, 760),
        size: randomRange(airRandom, 0.35, 1.6),
        speed: randomRange(airRandom, 3, 13),
        phase: airRandom() * TAU,
        warm: airRandom() > 0.72
      }));

      function drawAirMotes(time) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const mote of airMotes) {
          const y = ((mote.y - time * mote.speed + 9000) % 760) + 40;
          const x = mote.x + Math.sin(time * 0.21 + mote.phase) * 17;
          const shimmer = 0.16 + 0.18 * Math.sin(time * 1.3 + mote.phase);
          ctx.globalAlpha = Math.max(0.025, shimmer);

      function updateFish(delta, time) {
        if (memoryShown && time >= memoryHideAt) {

        let visibleFishCount = fishSchool.reduce(
          (count, fish) =>
            count + (fishIntersectsBounds(fish.state, visibleBounds) ? 1 : 0),

        for (const fish of fishSchool) {
          const isSelected = fish.index === selectedFish;

          const responsiveness = isSelected ? 2.7 : 1.35;
          const factor = 1 - Math.exp(-delta * responsiveness);

          if (!fish.initialized) {
            if (!isSelected) {
              fish.state.y = target.y;
              fish.state.scale = target.scale;
              fish.state.rot = target.rot;

            alignLanePhaseToCurrentState(fish, time);
            target.x = fish.state.x;
            visibleFishCount += 1;

        ctx.beginPath();

        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = edge;
